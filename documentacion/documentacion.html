E** — Lo que todavía no está decidido, con lo que hace falta para decidirlo.\n\n## 11. Dónde vive en el código\n\n> **PENDIENTE** — Lo que ya existe y lo que este documento pide crear.\n", "core/07-la-visita.md": "# La visita\n\nEl episodio: una visita del paciente. Es el tronco del que cuelga todo lo que se le hace, hoy laboratorio y mañana imagenología.\n\n## 1. Qué es y por qué existe\n\n> **PENDIENTE** — Definición en una frase, en palabras del laboratorio. Qué problema resuelve y qué pasaría si esta pieza no existiera.\n\n## 2. Las tablas y sus campos\n\n> **PENDIENTE** — Cada tabla del territorio, columna por columna: tipo, si admite nulos, valor por defecto, para qué sirve y qué resuelve. Las llaves foráneas salientes y quién apunta a estas tablas. Comprobado contra la base, no de memoria.\n\n## 3. Quién la crea y con qué datos\n\n> **PENDIENTE** — Quién la da de alta, en qué momento del flujo, qué campos son obligatorios y cuáles genera el sistema solo. Qué hace falta para que sea usable.\n\n## 4. Ciclo de vida y estados\n\n> **PENDIENTE** — Los estados por los que pasa, las transiciones permitidas, quién dispara cada cambio y qué queda registrado. Cómo se retira sin borrarla.\n\n## 5. Flujos propios\n\n> **PENDIENTE** — Los flujos que son solo de esta pieza, con código (`F-X-1`, `F-X-2`…). Los que tocan varios territorios se listan aquí pero se escriben en `flujos/`.\n\n## 6. Reglas propias\n\n> **PENDIENTE** — Los invariantes de esta pieza, numerados para poder citarlos desde otros documentos. Qué es siempre verdad.\n\n## 7. Cómo vive con las demás\n\n> **PENDIENTE** — Una subsección por cada pieza con la que se relaciona: qué le da, qué le exige, y qué pasa si la otra cambia o se retira.\n\n## 8. Quién puede hacer qué\n\n> **PENDIENTE** — Los permisos involucrados y qué rol los tiene. Qué acciones se otorgan a mano y por qué.\n\n## 9. Qué puede salir mal\n\n> **PENDIENTE** — Casos límite, errores conocidos y decisiones que envejecen mal. Es la sección donde se cazan los problemas.\n\n## 10. Preguntas abiertas\n\n> **PENDIENTE** — Lo que todavía no está decidido, con lo que hace falta para decidirlo.\n\n## 11. Dónde vive en el código\n\n> **PENDIENTE** — Lo que ya existe y lo que este documento pide crear.\n", "core/08-el-documento.md": "# El documento\n\nInforme, versiones y entrega. Vive en el núcleo porque las dos ramas emiten documentos con el mismo comportamiento.\n\n## 1. Qué es y por qué existe\n\n> **PENDIENTE** — Definición en una frase, en palabras del laboratorio. Qué problema resuelve y qué pasaría si esta pieza no existiera.\n\n## 2. Las tablas y sus campos\n\n> **PENDIENTE** — Cada tabla del territorio, columna por columna: tipo, si admite nulos, valor por defecto, para qué sirve y qué resuelve. Las llaves foráneas salientes y quién apunta a estas tablas. Comprobado contra la base, no de memoria.\n\n## 3. Quién la crea y con qué datos\n\n> **PENDIENTE** — Quién la da de alta, en qué momento del flujo, qué campos son obligatorios y cuáles genera el sistema solo. Qué hace falta para que sea usable.\n\n## 4. Ciclo de vida y estados\n\n> **PENDIENTE** — Los estados por los que pasa, las transiciones permitidas, quién dispara cada cambio y qué queda registrado. Cómo se retira sin borrarla.\n\n## 5. Flujos propios\n\n> **PENDIENTE** — Los flujos que son solo de esta pieza, con código (`F-X-1`, `F-X-2`…). Los que tocan varios territorios se listan aquí pero se escriben en `flujos/`.\n\n## 6. Reglas propias\n\n> **PENDIENTE** — Los invariantes de esta pieza, numerados para poder citarlos desde otros documentos. Qué es siempre verdad.\n\n## 7. Cómo vive con las demás\n\n> **PENDIENTE** — Una subsección por cada pieza con la que se relaciona: qué le da, qué le exige, y qué pasa si la otra cambia o se retira.\n\n## 8. Quién puede hacer qué\n\n> **PENDIENTE** — Los permisos involucrados y qué rol los tiene. Qué acciones se otorgan a mano y por qué.\n\n## 9. Qué puede salir mal\n\n> **PENDIENTE** — Casos límite, errores conocidos y decisiones que envejecen mal. Es la sección donde se cazan los problemas.\n\n## 10. Preguntas abiertas\n\n> **PENDIENTE** — Lo que todavía no está decidido, con lo que hace falta para decidirlo.\n\n## 11. Dónde vive en el código\n\n> **PENDIENTE** — Lo que ya existe y lo que este documento pide crear.\n", "core/09-el-rastro.md": "# El rastro\n\nAuditoría: quién hizo qué, cuándo y sobre qué. Transversal a propósito, porque si vive en cada módulo ninguno la implementa completa.\n\n## 1. Qué es y por qué existe\n\n> **PENDIENTE** — Definición en una frase, en palabras del laboratorio. Qué problema resuelve y qué pasaría si esta pieza no existiera.\n\n## 2. Las tablas y sus campos\n\n> **PENDIENTE** — Cada tabla del territorio, columna por columna: tipo, si admite nulos, valor por defecto, para qué sirve y qué resuelve. Las llaves foráneas salientes y quién apunta a estas tablas. Comprobado contra la base, no de memoria.\n\n## 3. Quién la crea y con qué datos\n\n> **PENDIENTE** — Quién la da de alta, en qué momento del flujo, qué campos son obligatorios y cuáles genera el sistema solo. Qué hace falta para que sea usable.\n\n## 4. Ciclo de vida y estados\n\n> **PENDIENTE** — Los estados por los que pasa, las transiciones permitidas, quién dispara cada cambio y qué queda registrado. Cómo se retira sin borrarla.\n\n## 5. Flujos propios\n\n> **PENDIENTE** — Los flujos que son solo de esta pieza, con código (`F-X-1`, `F-X-2`…). Los que tocan varios territorios se listan aquí pero se escriben en `flujos/`.\n\n## 6. Reglas propias\n\n> **PENDIENTE** — Los invariantes de esta pieza, numerados para poder citarlos desde otros documentos. Qué es siempre verdad.\n\n## 7. Cómo vive con las demás\n\n> **PENDIENTE** — Una subsección por cada pieza con la que se relaciona: qué le da, qué le exige, y qué pasa si la otra cambia o se retira.\n\n## 8. Quién puede hacer qué\n\n> **PENDIENTE** — Los permisos involucrados y qué rol los tiene. Qué acciones se otorgan a mano y por qué.\n\n## 9. Qué puede salir mal\n\n> **PENDIENTE** — Casos límite, errores conocidos y decisiones que envejecen mal. Es la sección donde se cazan los problemas.\n\n## 10. Preguntas abiertas\n\n> **PENDIENTE** — Lo que todavía no está decidido, con lo que hace falta para decidirlo.\n\n## 11. Dónde vive en el código\n\n> **PENDIENTE** — Lo que ya existe y lo que este documento pide crear.\n", "flujos/01-alta-de-un-cliente.md": "# Alta de un cliente\n\nDe la firma del acuerdo al primer usuario que puede entrar. Toca empresa, sucursal,\ncorrelativos, convenio, módulos, roles, empleado y usuario: por eso es un flujo\ncompartido y no vive dentro de un territorio.\n\n## 1. Qué dispara este flujo\n\nUn acuerdo comercial cerrado. Puede ser de tres clases y el sistema las distingue\nporque cambian lo que pasa después:\n\n| Motivo del alta | Qué significa | Estado inicial |\n|---|---|---|\n| `prueba` | Evaluación con fecha de vencimiento | `prueba` |\n| `contrato` | Contrato firmado o pago recibido | `activa` |\n| `migracion` | Viene de otro sistema y trae datos | `activa` |\n\n**Quién está delante de la pantalla:** el operador de la plataforma. Nunca el\ncliente, y nunca desde la aplicación del producto.\n\n> **REGLA** — Ver `E-8` en `core/01-la-empresa.md`. El alta es un acto del operador.\n\n## 2. Antes de empezar\n\nLo que el operador tiene que tener en la mano antes de abrir el formulario:\n\n- Razón social y, si existe, el RTN.\n- Nombre, dirección y teléfono de la primera sucursal. **La dirección y el teléfono\n  no son opcionales**: van impresos en el encabezado de cada informe.\n- Un código corto para la sucursal, de 2 a 6 caracteres en mayúscula. Va en los\n  correlativos y en las etiquetas de los tubos, así que se decide una vez y no se\n  cambia.\n- Nombre, apellidos y **correo** de la persona que va a administrar el sistema.\n- Qué módulos se contrataron.\n- Si es prueba, hasta qué fecha.\n\n> **RIESGO** — Si el correo del administrador está mal, el alta termina «bien» y\n> nadie recibe nada. Conviene que el formulario lo pida dos veces, como cualquier\n> campo que no se puede verificar en el momento.\n\n## 3. El camino normal\n\n### Paso 1 · Validar antes de tocar nada\n\nEl sistema comprueba, en este orden:\n\n1. Que el RTN no exista ya en otra empresa, si viene.\n2. Que el código de sucursal tenga el formato correcto.\n3. Que el correo del administrador tenga forma de correo.\n4. Que los módulos elegidos existan en el catálogo del producto.\n\nSi algo falla, no se crea nada. Esto es una validación de formulario, no una\ntransacción a medias.\n\n### Paso 2 · Crear todo, en una sola transacción\n\n> **REGLA** — `F1-1` · El alta es **todo o nada**. Si cualquier paso falla, no\n> queda ninguna fila. Una empresa a medias es peor que ninguna empresa: parece que\n> existe y no funciona.\n\nEn una sola transacción se crea:\n\n| # | Qué | Detalle |\n|---|---|---|\n| 1 | La empresa | Con el estado que corresponde al motivo del alta |\n| 2 | La primera sucursal | Activa, con su código, dirección y teléfono |\n| 3 | Los cinco correlativos | `expediente` por empresa; `episodio`, `orden`, `informe` y `muestra` por sucursal, con el código de sucursal como prefijo |\n| 4 | El convenio `Particular` | Marcado como predeterminado. Sin él ninguna orden puede existir |\n| 5 | Los módulos contratados | Una fila por módulo en esa sucursal |\n| 6 | Los cuatro roles | Copiados de las plantillas, **con sus permisos** |\n| 7 | La configuración del informe | Nombre, dirección y teléfono para el encabezado |\n| 8 | El empleado administrador | Con nombre, apellidos y correo |\n| 9 | El usuario administrador | Con el rol Administrador, **sin contraseña**, en estado `pendiente_activacion` |\n| 10 | El acceso a la sucursal | El administrador puede operar en la sede que se creó |\n| 11 | La fila del historial de estado | Motivo del alta y quién la creó |\n\n### Paso 3 · Entregar el acceso\n\n> **REGLA** — `F1-2` · El operador **nunca** conoce la contraseña del cliente. No\n> se inventa una para dictarla por teléfono ni para mandarla por correo.\n\n1. Se genera un enlace de activación de un solo uso, con vencimiento corto.\n2. Se envía al correo del administrador.\n3. El administrador entra por ese enlace y define su propia contraseña.\n4. El usuario pasa de `pendiente_activacion` a `activo`.\n5. El enlace queda usado y no sirve dos veces.\n\n> **ABIERTO** — Cuánto dura el enlace. Setenta y dos horas parece razonable para\n> alguien que quizá no revisa el correo el mismo día, pero es una decisión que\n> conviene tomar a propósito y no por descuido.\n\n> **ABIERTO** — Qué pasa si el enlace vence sin usarse. Lo natural es que el\n> operador pueda reenviarlo, y que eso quede en el historial.\n\n### Paso 4 · Verificar que quedó entregable\n\nEl operador ejecuta la comprobación de los ocho requisitos del umbral entregable\n(ver `core/01-la-empresa.md`, «Quién la crea y con qué datos»). El sistema contesta con la lista de lo\nque falta, si falta algo.\n\n> **REGLA** — `F1-3` · El alta no se da por terminada hasta que la comprobación\n> pasa. Si el sistema dice que falta algo, es que falta.\n\n### Paso 5 · Acompañar hasta operable\n\nEsto ya no es del operador solo: es la puesta en marcha con el cliente.\n\n1. El administrador crea a sus empleados y les da usuarios.\n2. El bioquímico configura áreas, tipos de muestra, analitos y pruebas.\n3. **El bioquímico revisa los rangos de referencia.** No es opcional: los que trae\n   el sistema son valores generales de adulto, no los del laboratorio.\n4. Se registran los equipos y su mapeo de códigos.\n5. Se hace una orden de prueba de punta a punta, con un paciente ficticio, y se\n   anula al terminar.\n\n> **RIESGO** — El paso 5 es el que más se salta y el que más problemas evita. Un\n> laboratorio que descubre el primer día real que el analizador no está mapeado\n> pierde la confianza en el sistema de inmediato.\n\n### El alta a mano · lo que de verdad se ejecuta hoy\n\nTodo lo de arriba describe el alta **cuando exista la consola del operador**.\nMientras no exista, el alta se hace escribiendo las filas a mano, y esta es la\nsecuencia exacta —comprobada contra PostgreSQL 18, con el laboratorio Ochoa como\nprimer caso—.\n\nSon **diez pasos y el orden no es negociable**: cada uno necesita el anterior.\n\n| # | Tabla | Por qué va aquí |\n|---|---|---|\n| 1 | `core.empresa` | Es la raíz. No depende de nada |\n| 2 | `core.sucursal` | Necesita la empresa |\n| 3 | `core.empleado` | La persona. Existe aunque nunca tenga cuenta |\n| 4 | `core.rol` | El rol es de la empresa, no de la sede |\n| 5 | `core.usuario` | Necesita **empleado y rol a la vez** |\n| 6 | `core.acceso_sucursal` | En qué sede trabaja |\n| 7 | `plataforma.modulo` | El catálogo del producto. **Lo escribe el operador** |\n| 8 | `plataforma.modulo_sucursal` | Qué compró la sede. **También el operador** |\n| 9 | `plataforma.permiso` + `core.rol_permiso` | El catálogo de permisos y qué le toca al rol |\n| 10 | `core.convenio` + `core.correlativo` | Sin esto **no se puede abrir un episodio** |\n\n#### 1 · La empresa\n\n```sql\nINSERT INTO core.empresa (nombre, nombre_comercial, rtn, estado, nivel_acceso)\nVALUES ('Laboratorio Clinico Ochoa S. de R.L.', 'Laboratorio Ochoa',\n        '08019016543210', 'activa', 'completo');\n```\n\n#### 2 · La sucursal\n\n```sql\nINSERT INTO core.sucursal (empresa_id, nombre, codigo, direccion, telefono)\nSELECT e.empresa_id, 'Casa Matriz', 'CEN',\n       'Col. Palmira, 2a calle, Edificio Ochoa, Tegucigalpa, Francisco Morazan',\n       '2232-4455'\nFROM core.empresa e\nWHERE e.rtn = '08019016543210';\n```\n\n> **REGLA** — `F1-4` · **Cada paso se cuelga del anterior buscándolo por su llave\n> natural, nunca por un id escrito a mano.** Si se escribe `empresa_id = 1` y\n> alguien recarga la base, el 1 puede ser otra empresa y la fila queda colgada del\n> padre equivocado — sin error y en silencio. El RTN es único: buscar por él no se\n> puede equivocar.\n\n#### 3 · El empleado administrador\n\n```sql\nINSERT INTO core.empleado\n  (empresa_id, nombres, apellidos, documento, telefono, correo,\n   cargo, numero_colegiacion)\nSELECT e.empresa_id,\n       'Marlon Alberto', 'Ochoa Discua', '0801198504321', '9988-7766',\n       'marlon.ochoa@labochoa.hn',\n       'Propietario y bioquimico responsable', 'CMQ-2841'\nFROM core.empresa e\nWHERE e.rtn = '08019016543210';\n```\n\nLleva `numero_colegiacion` porque en un laboratorio chico el dueño es el\nbioquímico: administra **y** firma. Sin ese número, `lab.validar_resultado()` lo\nrechaza aunque tenga el permiso `resultado.validar` — *un permiso no convierte a\nnadie en bioquímico*. Si el administrador fuera solo administrativo, la columna va\nen nulo.\n\n#### 4 · El rol\n\n```sql\nINSERT INTO core.rol (empresa_id, nombre, descripcion, es_sistema)\nSELECT e.empresa_id, 'Administrador',\n       'Configura la empresa: usuarios, roles, sucursales, convenios y precios',\n       true\nFROM core.empresa e\nWHERE e.rtn = '08019016543210';\n```\n\n#### 5 · El usuario\n\n```sql\nINSERT INTO core.usuario\n  (empresa_id, empleado_id, rol_id, username, password_hash, estado)\nSELECT em.empresa_id, em.empleado_id, r.rol_id,\n       'marlon.ochoa', 'SIN_CLAVE_PENDIENTE_ACTIVACION', 'activo'\nFROM core.empleado em\nJOIN core.rol r ON r.empresa_id = em.empresa_id AND r.nombre = 'Administrador'\nWHERE em.documento = '0801198504321';\n```\n\n> **RIESGO** — `password_hash` es `NOT NULL` y el estado `pendiente_activacion`\n> **no existe** en `core.estado_usuario`: solo hay `activo`, `suspendido` y\n> `bloqueado`. Por eso aquí va un texto que no es hash de nada —nadie puede entrar\n> con él— y el usuario queda `activo` de mentira. Es `H-17`, y es lo que impide\n> cerrar el Paso 3 de este flujo.\n\n#### 6 · El acceso a la sede\n\n```sql\nINSERT INTO core.acceso_sucursal (usuario_id, sucursal_id, empresa_id)\nSELECT u.usuario_id, s.sucursal_id, u.empresa_id\nFROM core.usuario u\nJOIN core.sucursal s ON s.empresa_id = u.empresa_id AND s.codigo = 'CEN'\nWHERE u.username = 'marlon.ochoa';\n```\n\n`empresa_id` sale de `u.empresa_id` y el `JOIN` exige que la sede sea de esa misma\nempresa. Así es imposible darle a un usuario acceso a la sucursal de otra.\n\n> **ABIERTO** — Esta fila **no la lee nadie** (`H-31`). Un usuario con cero filas\n> aquí opera igual en cualquier sede de su empresa. Y **no se puede quitar**\n> (`H-30`): la tabla no tiene `activo` ni fecha de revocación, y `DELETE` está\n> revocado. Hoy es una declaración de intención, no una puerta.\n\n#### 7 y 8 · Los módulos · **esto es del operador**\n\n```sql\nINSERT INTO plataforma.modulo (modulo_id, nombre, descripcion) VALUES\n  ('core',        'Nucleo',              'Pacientes, episodios, informes y entrega. No es opcional.'),\n  ('lab_clinico', 'Laboratorio clinico', 'Ordenes, muestras, resultados y validacion.')\nON CONFLICT (modulo_id) DO NOTHING;\n\nINSERT INTO plataforma.modulo_sucursal\n  (sucursal_id, modulo_id, empresa_id, activo, asignado_por)\nSELECT s.sucursal_id, m.modulo_id, s.empresa_id, true, 'operador'\nFROM core.sucursal s\nJOIN core.empresa  e ON e.empresa_id = s.empresa_id\nCROSS JOIN (VALUES ('core'), ('lab_clinico')) AS m(modulo_id)\nWHERE e.rtn = '08019016543210' AND s.codigo = 'CEN'\nON CONFLICT DO NOTHING;\n```\n\n> **REGLA** — `F1-5` · **`core` se enciende siempre, junto con lo que se haya\n> vendido.** De los 30 permisos, 16 son del módulo `core`. Como `usuario_puede()`\n> intersecta contra la licencia, si `core` no está encendido esos 16 se caen y la\n> empresa nace sin poder hacer nada, ni siquiera administrarse. Es `H-27`, cerrado\n> por `H-99`.\n\n#### 9 · Los permisos del rol\n\nEl catálogo de permisos lo siembra `06_semillas.sql`. Con él cargado, este script\nle da al administrador **todos los permisos de los módulos que la empresa tiene\nencendidos**:\n\n```sql\nWITH parametros AS (\n  SELECT '08019016543210'::text AS rtn, 'Administrador'::text AS rol\n),\nempresa AS (\n  SELECT e.empresa_id, p.rol FROM core.empresa e, parametros p WHERE e.rtn = p.rtn\n),\nrol AS (\n  SELECT r.rol_id, r.empresa_id FROM core.rol r\n  JOIN empresa e ON r.empresa_id = e.empresa_id AND r.nombre = e.rol\n),\ncontratados AS (\n  SELECT DISTINCT ms.modulo_id\n  FROM plataforma.modulo_sucursal ms\n  JOIN empresa e ON e.empresa_id = ms.empresa_id\n  WHERE ms.activo\n)\nINSERT INTO core.rol_permiso (rol_id, permiso_id, empresa_id)\nSELECT r.rol_id, pm.permiso_id, r.empresa_id\nFROM rol r\nCROSS JOIN plataforma.permiso pm\nWHERE pm.modulo_id IN (SELECT modulo_id FROM contratados)\nON CONFLICT (rol_id, permiso_id) DO NOTHING;\n```\n\nEs **idempotente y reutilizable**: se cambia el RTN para otra empresa, o se vuelve\na correr cuando el operador venda un módulo nuevo y solo agrega lo que falta.\n\n> **REGLA** — `F1-6` · **El rol Administrador se define por exclusión**: todo lo\n> que exista en el catálogo, de los módulos contratados. Por eso no lleva una lista\n> escrita a mano — una lista fija se olvidaría de actualizar el día que entre un\n> módulo nuevo. Los otros tres roles sí van por lista, porque su gracia es que\n> **no** tengan todo.\n\n#### 10 · El convenio y los correlativos\n\n```sql\n-- Particular · el paciente paga en caja. OBLIGATORIO en toda empresa\nINSERT INTO core.convenio\n  (empresa_id, nombre, tipo, modalidad_cobro, es_predeterminado, activo)\nSELECT e.empresa_id, 'Particular', 'particular', 'particular', true, true\nFROM core.empresa e WHERE e.rtn = '08019016543210';\n\n-- los cinco correlativos\nINSERT INTO core.correlativo (empresa_id, sucursal_id, tipo, prefijo, ancho)\nSELECT s.empresa_id, c.sucursal_id, c.tipo::core.tipo_correlativo, c.prefijo, c.ancho\nFROM core.sucursal s\nJOIN core.empresa e ON e.empresa_id = s.empresa_id\nCROSS JOIN LATERAL (VALUES\n    (NULL::bigint,  'expediente', 'EXP-',           6),\n    (s.sucursal_id, 'episodio',   s.codigo || '-',  6),\n    (s.sucursal_id, 'informe',    s.codigo || 'I-', 6),\n    (s.sucursal_id, 'orden',      s.codigo || 'O-', 6),\n    (s.sucursal_id, 'muestra',    s.codigo || 'M-', 8)\n  ) AS c(sucursal_id, tipo, prefijo, ancho)\nWHERE e.rtn = '08019016543210' AND s.codigo = 'CEN';\n```\n\nQueda así:\n\n```\n    tipo    |      ambito       | prefijo |    proximo\n expediente | (toda la empresa) | EXP-    | EXP-000001\n episodio   | CEN               | CEN-    | CEN-000001\n informe    | CEN               | CENI-   | CENI-000001\n orden      | CEN               | CENO-   | CENO-000001\n muestra    | CEN               | CENM-   | CENM-00000001\n```\n\n**El expediente es de la empresa; los otros cuatro, de la sede.** `sucursal_id` en\nnulo significa «toda la empresa», y es a propósito: el paciente es de la empresa\n—el mismo señor se atiende hoy en una sede y mañana en otra con el mismo\n`EXP-000123`—, mientras que el episodio ocurrió en un lugar concreto.\n\n**La muestra lleva ancho 8** y los demás 6: son las que más volumen tienen —varios\ntubos por orden— y ese número va impreso en el código de barras.\n\n#### Lo que se comprobó\n\nSin el paso 10 el alta **no sirve**. Intentar abrir el primer episodio antes de\ncrear el convenio da:\n\n```\nERROR: insert or update on table \"episodio\" violates foreign key\n       constraint \"fk_episodio_convenio\"\nDETAIL: Key (convenio_id, empresa_id)=(1, 1) is not present in table \"convenio\".\n```\n\nPor eso `E-6` dice que toda empresa nace con un convenio predeterminado: no es una\ncomodidad, es lo que permite que `core.episodio.convenio_id` sea `NOT NULL`.\n\n#### Lo que esta secuencia NO resuelve\n\n**Falta entera la parte del operador.** Esta secuencia la ejecuta alguien conectado\ncomo `postgres`, a mano, contra la base. Eso significa que hoy:\n\n- **No hay quién** — no existe la consola del operador, con su propia\n  autenticación y su propio rol de base de datos (`H-16`).\n- **No hay control** — `core.crear_empresa()` es `SECURITY DEFINER` y no comprueba\n  ningún permiso: cualquiera que pueda ejecutarla crea empresas (`H-1`).\n- **No hay rastro** — ninguna de estas diez filas deja un `audit.evento`. No queda\n  registrado quién dio de alta la empresa ni cuándo.\n- **No hay cliente** — no se crearon `comercial.cliente`, `contacto` ni\n  `cliente_empresa`. La empresa nace **sin cliente vigente**, que es el estado que\n  `E-21` da por imposible, y sin poder facturarle (`H-82`).\n- **No hay contrato** — nada conecta `comercial.contrato` con\n  `plataforma.modulo_sucursal`: el operador enciende módulos y no queda registro de\n  qué se vendió.\n\n> **PENDIENTE** — La parte del operador. Es lo único que falta para que este flujo\n> deje de ser una lista de `INSERT` y pase a ser una operación del sistema.\n\n## 4. Los desvíos\n\n### El cliente ya trae datos de otro sistema\n\nEl motivo del alta es `migracion`. Cambia el paso 5: antes de que entre el primer\npaciente real, hay que cargar el histórico.\n\n> **PENDIENTE** — El flujo de migración completo: qué se puede importar (pacientes,\n> catálogo, resultados históricos), en qué formato, y qué pasa con los expedientes\n> que ya tenían número en el sistema viejo. Es un documento propio.\n\n### La empresa tiene varias sucursales desde el principio\n\nEl alta crea una. Las demás las crea el administrador después, y cada una necesita\nsus propios correlativos y sus propios módulos activos. **Hoy eso no está\nautomatizado, y es la falla H-24**: la regla `S-2` del territorio de la sucursal\ndice que una sede nace con sus cuatro correlativos o no nace, y\n`core.crear_sucursal()` todavía no existe.\n\n> **ABIERTO** — ¿Debería el alta aceptar varias sucursales de una vez? Para un\n> cliente con tres sedes, crear dos a mano después es una fuente de olvidos.\n\n### Es la segunda empresa del mismo edificio\n\nEl caso de la clínica y el laboratorio. Se dan de alta como dos empresas\nindependientes, y **después** se crea el acuerdo de asociación entre ellas. Ese es\notro flujo: `flujos/04-derivacion.md`.\n\n### El administrador se va antes de activar su cuenta\n\nEl operador anula el enlace, cambia el correo del empleado y genera uno nuevo. El\nusuario sigue siendo el mismo; lo que cambia es a quién se le entrega.\n\n## 5. Qué queda en la base al terminar\n\nPara una empresa nueva con una sucursal y el módulo de laboratorio:\n\n**Lo que hoy deja `core.crear_empresa()`** — contado ejecutándola, no de memoria:\n\n```\ncore.empresa                 1 fila\ncore.sucursal                1 fila\ncore.correlativo             5 filas\ncore.convenio                1 fila  (Particular, predeterminado)\nplataforma.modulo_sucursal   2 filas (core y lab_clinico)\ncore.rol                     4 filas\ncore.rol_permiso            64 filas (30 + 15 + 11 + 8)\n```\n\n**Lo que deja en cero, y debería crear:**\n\n```\ncore.empleado                0    ← deberia ser 1 (el administrador)\ncore.usuario                 0    ← deberia ser 1\ncore.acceso_sucursal         0    ← deberia ser 1\naudit.evento                 0    ← deberia ser 1 (empresa.crear)\n```\n\nLos 64 permisos se reparten así: **Administrador 30** —todos los del catálogo, por\nexclusión—, Bioquímico 15, Recepción 11, Analista 8.\n\nTres tablas que este documento mencionaba **no existen**:\n`core.empresa_configuracion` sigue siendo una propuesta,\n`core.empresa_estado_historial` se fue al esquema comercial como\n`comercial.relacion_evento`, y el estado `pendiente_activacion` no está en el\nenum.\n\nCero pacientes, cero episodios, cero pruebas en el catálogo. Eso es correcto: el\numbral entregable no incluye el catálogo clínico, porque lo define el bioquímico y\nno el operador.\n\n## 6. Qué puede fallar\n\n| Qué pasa | Qué ve el operador | Qué hace |\n|---|---|---|\n| El RTN ya existe en otra empresa | «Ese RTN ya está registrado en *nombre*» | Verificar si es la misma empresa dándose de alta dos veces |\n| El código de sucursal tiene formato inválido | «El código son 2 a 6 letras o números en mayúscula» | Corregirlo |\n| El correo no tiene forma válida | «Revisa el correo del administrador» | Corregirlo |\n| Falla a mitad de la transacción | «No se pudo crear la empresa» y nada queda creado | Reintentar; si persiste, es un error del sistema |\n| El correo de activación no llega | Nada, y ese es el problema | El operador puede reenviar el enlace desde la ficha |\n| La comprobación del paso 4 falla | La lista de lo que falta | Completarlo antes de entregar |\n\n> **RIESGO** — Hoy `core.crear_empresa()` hace los pasos 1 a 6 y **no hace el 7,\n> el 8, el 9, el 10 ni el 11**. Comprobado ejecutándola: deja cero empleados, cero\n> usuarios, cero accesos y cero eventos de auditoría. La empresa nace con cuatro\n> roles llenos de permisos y **nadie que pueda entrar**. *(H-2)*\n\n> **RIESGO** — `core.crear_empresa()` es `SECURITY DEFINER` y no comprueba\n> permisos. Mientras no exista una consola de operador con su propia\n> autenticación, esa función no puede quedar expuesta en la API del producto.\n> *(H-1)*\n\n## 7. Reglas que este flujo hace cumplir\n\n- `E-6` — Toda empresa tiene al menos una sucursal y un convenio predeterminado.\n- `E-8` — Solo el operador crea empresas.\n- `E-9` — No se entrega una empresa que no se pueda usar.\n- `E-10` — El sistema sabe en qué umbral está cada empresa.\n- `S-1` — La primera sucursal la crea el operador dentro del alta\n  (`core/02-la-sucursal.md`).\n- `S-2` — Una sucursal nace con sus correlativos o no nace.\n- `F1-1` — El alta es todo o nada.\n- `F1-2` — El operador nunca conoce la contraseña del cliente.\n- `F1-3` — El alta no termina hasta que la comprobación pasa.\n- `F1-4` — Cada fila se cuelga de la anterior por su llave natural, nunca por un\n  id escrito a mano.\n- `F1-5` — El módulo `core` se enciende siempre, junto con lo que se haya vendido.\n- `F1-6` — El rol Administrador se define por exclusión: todo el catálogo de los\n  módulos contratados.\n\n## 8. Preguntas abiertas\n\n1. ¿Cuánto dura el enlace de activación y qué pasa si vence?\n2. ¿El alta debería aceptar varias sucursales de una vez?\n3. ¿Qué incluye exactamente la migración desde otro sistema?\n4. ¿Quién hace la puesta en marcha del paso 5: tú, o el cliente con un instructivo?\n   La respuesta cambia cuánto tiene que guiar el sistema.\n5. ¿Se le cobra al cliente la puesta en marcha? Si sí, conviene que el sistema\n   registre cuándo terminó.\n6. **¿Por dónde ejecuta el operador todo esto?** Es la pregunta que bloquea el\n   flujo entero: hoy la secuencia se corre a mano conectado como `postgres`. Sin\n   una consola con autenticación propia no hay quién, no hay control y no hay\n   rastro (`H-16`, `H-1`).\n7. ¿El alta crea también `comercial.cliente`, `contacto` y `cliente_empresa`? Hoy\n   no lo hace, y la empresa nace sin cliente vigente (`H-82`).\n\n## 9. Dónde vive en el código\n\n### Lo que ya existe\n\n| Qué | Dónde |\n|---|---|\n| Pasos 1 a 6 del alta | `core.crear_empresa()` — `04_funciones.sql` |\n| Los cuatro roles y sus 64 permisos | Dentro de `core.crear_empresa()`. Ya no hay tablas de plantilla |\n| El catálogo de módulos y los 30 permisos | `06_semillas.sql` |\n| La secuencia a mano, paso a paso | La sección «El alta a mano» de este documento |\n\n### Lo que este flujo pide crear\n\n| Qué | Para qué |\n|---|---|\n| **Consola de operador** | **Lo que bloquea el flujo entero.** Sin ella todo esto se corre a mano como `postgres` |\n| Extender `core.crear_empresa()` | Que haga también los pasos 7 a 11 |\n| `core.empresa_configuracion` | El encabezado del informe |\n| Estado `pendiente_activacion` en `core.estado_usuario` | Un usuario que existe y todavía no puede entrar |\n| `core.activacion_usuario` | El enlace de un solo uso, con vencimiento y uso registrado |\n| `core.empresa_lista_para()` | La comprobación del paso 4 |\n| El evento `empresa.crear` en `audit.evento` | Hoy el alta no deja ningún rastro |\n| El alta de `comercial.cliente` | Que la empresa nazca con cliente vigente (`E-21`, `H-82`) |\n| Unir `comercial.contrato` con `plataforma.modulo_sucursal` | Que quede registro de qué módulos se vendieron |\n", "flujos/02-alta-de-personal.md": "# Alta de personal\n\nCómo entra al sistema una persona que empieza a trabajar en el laboratorio, y cómo sale cuando se va.\n\n## 1. Qué dispara este flujo\n\n> **PENDIENTE** — El hecho del mundo real que lo inicia, y quién está delante de la pantalla.\n\n## 2. Antes de empezar\n\n> **PENDIENTE** — Precondiciones: qué tiene que existir ya para que esto sea posible.\n\n## 3. El camino normal\n\n> **PENDIENTE** — Los pasos numerados. Por cada paso: quién lo hace, qué escribe, qué comprueba el sistema y qué queda guardado.\n\n## 4. Los desvíos\n\n> **PENDIENTE** — Los caminos alternativos que pasan de verdad, no los teóricos.\n\n## 5. Qué queda en la base al terminar\n\n> **PENDIENTE** — Las filas concretas que existen cuando el flujo termina bien.\n\n## 6. Qué puede fallar\n\n> **PENDIENTE** — Errores esperados, con el mensaje que debe ver la persona y qué puede hacer al respecto.\n\n## 7. Reglas que este flujo hace cumplir\n\n> **PENDIENTE** — Los invariantes que se apoyan en este flujo, citando los documentos de territorio.\n\n## 8. Preguntas abiertas\n\n> **PENDIENTE** — Lo que falta decidir.\n\n## 9. Dónde vive en el código\n\n> **PENDIENTE** — Endpoints, servicios y funciones de base de datos.\n", "flujos/03-admision-de-un-paciente.md": "# Admisión de un paciente\n\nEl flujo más usado del sistema y el que más veces se hace mal. Del paciente que llega al mostrador a la orden creada.\n\n## 1. Qué dispara este flujo\n\n> **PENDIENTE** — El hecho del mundo real que lo inicia, y quién está delante de la pantalla.\n\n## 2. Antes de empezar\n\n> **PENDIENTE** — Precondiciones: qué tiene que existir ya para que esto sea posible.\n\n## 3. El camino normal\n\n> **PENDIENTE** — Los pasos numerados. Por cada paso: quién lo hace, qué escribe, qué comprueba el sistema y qué queda guardado.\n\n## 4. Los desvíos\n\n> **PENDIENTE** — Los caminos alternativos que pasan de verdad, no los teóricos.\n\n## 5. Qué queda en la base al terminar\n\n> **PENDIENTE** — Las filas concretas que existen cuando el flujo termina bien.\n\n## 6. Qué puede fallar\n\n> **PENDIENTE** — Errores esperados, con el mensaje que debe ver la persona y qué puede hacer al respecto.\n\n## 7. Reglas que este flujo hace cumplir\n\n> **PENDIENTE** — Los invariantes que se apoyan en este flujo, citando los documentos de territorio.\n\n## 8. Preguntas abiertas\n\n> **PENDIENTE** — Lo que falta decidir.\n\n## 9. Dónde vive en el código\n\n> **PENDIENTE** — Endpoints, servicios y funciones de base de datos.\n", "flujos/04-derivacion.md": "# Derivación entre empresas\n\nLa clínica manda un paciente al laboratorio. Es la única excepción al aislamiento y por eso el flujo se documenta aparte.\n\n## 1. Qué dispara este flujo\n\n> **PENDIENTE** — El hecho del mundo real que lo inicia, y quién está delante de la pantalla.\n\n## 2. Antes de empezar\n\n> **PENDIENTE** — Precondiciones: qué tiene que existir ya para que esto sea posible.\n\n## 3. El camino normal\n\n> **PENDIENTE** — Los pasos numerados. Por cada paso: quién lo hace, qué escribe, qué comprueba el sistema y qué queda guardado.\n\n## 4. Los desvíos\n\n> **PENDIENTE** — Los caminos alternativos que pasan de verdad, no los teóricos.\n\n## 5. Qué queda en la base al terminar\n\n> **PENDIENTE** — Las filas concretas que existen cuando el flujo termina bien.\n\n## 6. Qué puede fallar\n\n> **PENDIENTE** — Errores esperados, con el mensaje que debe ver la persona y qué puede hacer al respecto.\n\n## 7. Reglas que este flujo hace cumplir\n\n> **PENDIENTE** — Los invariantes que se apoyan en este flujo, citando los documentos de territorio.\n\n## 8. Preguntas abiertas\n\n> **PENDIENTE** — Lo que falta decidir.\n\n## 9. Dónde vive en el código\n\n> **PENDIENTE** — Endpoints, servicios y funciones de base de datos.\n", "flujos/05-emision-y-entrega.md": "# Emisión y entrega\n\nDel último resultado validado al informe en la mano de alguien, incluida la corrección de algo ya entregado.\n\n## 1. Qué dispara este flujo\n\n> **PENDIENTE** — El hecho del mundo real que lo inicia, y quién está delante de la pantalla.\n\n## 2. Antes de empezar\n\n> **PENDIENTE** — Precondiciones: qué tiene que existir ya para que esto sea posible.\n\n## 3. El camino normal\n\n> **PENDIENTE** — Los pasos numerados. Por cada paso: quién lo hace, qué escribe, qué comprueba el sistema y qué queda guardado.\n\n## 4. Los desvíos\n\n> **PENDIENTE** — Los caminos alternativos que pasan de verdad, no los teóricos.\n\n## 5. Qué queda en la base al terminar\n\n> **PENDIENTE** — Las filas concretas que existen cuando el flujo termina bien.\n\n## 6. Qué puede fallar\n\n> **PENDIENTE** — Errores esperados, con el mensaje que debe ver la persona y qué puede hacer al respecto.\n\n## 7. Reglas que este flujo hace cumplir\n\n> **PENDIENTE** — Los invariantes que se apoyan en este flujo, citando los documentos de territorio.\n\n## 8. Preguntas abiertas\n\n> **PENDIENTE** — Lo que falta decidir.\n\n## 9. Dónde vive en el código\n\n> **PENDIENTE** — Endpoints, servicios y funciones de base de datos.\n", "flujos/06-el-paciente-entre-dos-empresas.md": "# El paciente entre dos empresas\n\nQué pasa cuando el hospital y el laboratorio atienden al mismo señor, siendo dos\nempresas distintas que no comparten ni una fila.\n\n> **Este es el modelo decidido.** Manda sobre lo que digan los demás documentos\n> mientras no se actualicen: la identidad compartida de `core/05-la-identidad.md`\n> y la forma actual de `audit.derivacion` quedaron atrás. La sección 9 lista qué\n> falta reconciliar, y ese trabajo está anotado en `hallazgos.md`.\n>\n> Todavía **no hay tablas ni diagramas**, a propósito. La forma exacta se define\n> aparte; aquí está el comportamiento que esa forma tiene que sostener.\n\n---\n\n## 1. Quién es quién\n\n| | Qué es | De quién son sus datos |\n|---|---|---|\n| **El hospital** | Empresa cliente, con su propio sistema | Suyos |\n| **El laboratorio** | Empresa cliente, con su propio sistema | Suyos |\n| **La sede del laboratorio dentro del hospital** | Sucursal del **laboratorio** | Del laboratorio |\n| **La otra sede del laboratorio** | Sucursal del laboratorio, afuera | Del laboratorio |\n\n**El sello decide la pertenencia.** El examen sale firmado por el bioquímico y\nsellado por el laboratorio; entonces el resultado es del laboratorio, él responde\npor él y él lo conserva. Que la sede esté dentro del hospital no cambia de quién\nes el dato — cambia dónde está la puerta.\n\nY como las dos sedes son de la misma empresa, **entre ellas comparten todo**. El\npaciente que se atiende en la sede de adentro y después en la de afuera es el\nmismo expediente. Eso no es un problema que haya que resolver: es una sola\nempresa.\n\n---\n\n## 2. La pieza que hace que esto funcione: la referencia guardada\n\nNinguna de las dos empresas escribe en la fila de la otra. Lo que hacen es\n**anotar, cada una en su propia ficha del paciente, cómo lo llama la otra.**\n\n```\nFicha del hospital                    Ficha del laboratorio\n───────────────────                   ─────────────────────\nexpediente   H-000123                 expediente   L-000456\nnombre       Said Hoch                nombre       Said Hoch\ndocumento    0801-2004-00844          documento    0801-2004-00844\n                                      \nreferencia externa:                   referencia externa:\n  Laboratorio Ochoa → L-000456          Hospital San José → H-000123\n  confirmado por Rosa, 10/09/2026       confirmado por Rosa, 10/09/2026\n```\n\nNo es una llave foránea. No hay integridad referencial entre empresas. Es **un\ndato externo anotado sobre el propio paciente**, igual que se anota el número de\npóliza de un seguro.\n\n> **REGLA** — `F6-1` · La referencia externa la escribe cada empresa en su propia\n> ficha y nadie más la toca. Si está mal, la arregla quien la escribió, y esa\n> corrección no afecta a la otra empresa ni a ninguna tercera.\n\n> **REGLA** — `F6-2` · Una referencia externa **nace de una confirmación humana\n> con el paciente presente**, o de un cotejo de dos factores que el sistema pudo\n> resolver sin dudar. Nunca de una elección hecha desde una lista.\n\n### Los tres niveles de identidad\n\nSe usan en orden. Solo el tercero pide trabajo, y ese trabajo ya se hacía.\n\n| | Cuándo | Quién decide | Cuesta |\n|---|---|---|---|\n| **1 · Referencia guardada** | Ya se confirmó antes | Nadie, es automático | nada |\n| **2 · Cotejo de dos factores** | Primera vez, con documento | El que tiene los datos, contra los suyos | nada |\n| **3 · Confirmación humana** | Sin documento, o el cotejo dudó | Recepción, con el paciente enfrente | lo que ya costaba |\n\n> **REGLA** — `F6-3` · Si el cotejo no está seguro, **no devuelve nada y lo dice**.\n> «No encontré resultados» y «no puedo confirmar que estos resultados sean de este\n> paciente» son respuestas distintas y las dos tienen que existir. La primera deja\n> tranquilo al médico; la segunda le dice que le pregunte al paciente.\n\n---\n\n## 3. Llegó primero al hospital\n\nEl caso más común. El paciente nunca pasó por el laboratorio.\n\n**1 · Admisión en el hospital.** Recepción lo registra con sus datos. Nace su\nexpediente `H-000123`.\n\n**2 · Consulta.** El médico abre la ficha. El sistema del hospital busca si tiene\nreferencia al laboratorio: **no la tiene**. Pregunta igual, con documento y año de\nnacimiento. El laboratorio coteja contra lo suyo y contesta: *no lo conozco*.\n\nEl médico ve «sin historial de laboratorio», que es cierto.\n\n**3 · El médico pide un hemograma.** Sale una solicitud hacia el laboratorio con:\n\n- Los datos del paciente, y **el expediente del hospital** (`H-000123`)\n- Las pruebas pedidas\n- El convenio con el que se cobra\n- El médico solicitante\n- **El contexto clínico que cambia la interpretación**: embarazo, tratamiento,\n  ayuno, diagnóstico presuntivo\n- La urgencia\n\n**4 · La solicitud aparece en la sede de adentro.** No hay que aceptarla. **El\nenlace ya es la aceptación** —lo creó el operador cuando las dos empresas\nacordaron trabajar juntas— y una boleta que llega es trabajo, no una propuesta.\nQueda en la lista de pendientes de esa ventanilla, no de otra: el enlace es entre\n**esas dos sedes**, no entre las dos empresas.\n\n**5 · El paciente camina hasta la ventanilla.** Y acá pasa lo único que cuesta\nalgo, una sola vez en la vida de ese paciente:\n\nLa recepcionista lo tiene enfrente, le pide su identidad, y confirma que es él.\nComo no existía en el laboratorio, lo registra: nace `L-000456`.\n\n**6 · Nace el par de referencias.** En la misma operación:\n\n- El laboratorio anota en su ficha: *el Hospital San José lo llama `H-000123`*\n- La respuesta al hospital lleva `L-000456`, y el hospital lo anota en la suya\n\nDesde este momento, **estos dos nunca más se tienen que buscar.**\n\n**7 · Toma de muestra, proceso, validación.** El bioquímico valida y firma. El\ninforme sale **con el sello del laboratorio**, porque es el laboratorio el que\nresponde.\n\n**8 · Vuelve el resultado.** Atado a la orden, no al paciente — el hospital lo\narchiva bajo el paciente que la pidió, sin cotejar nada. Vuelven dos cosas:\n\n- **Los valores**, para que el médico los vea dentro de su propia historia clínica\n- **El informe firmado y sellado**, que es el documento con valor legal\n\n> **REGLA** — `F6-4` · El resultado vuelve atado a **la orden**, nunca al paciente.\n> Quien la pidió sabe de quién era; no hace falta volver a identificar a nadie.\n\n---\n\n## 4. Llegó directo al laboratorio\n\nNo hay hospital en esta historia. Es el flujo más corto y no tiene nada especial.\n\n**1 ·** Recepción del laboratorio lo registra: `L-000789`.\n**2 ·** Se le indica qué exámenes quiere o trae una orden en papel de un médico\nde afuera.\n**3 ·** Paga en el mostrador, con el convenio `Particular`.\n**4 ·** Muestra, proceso, validación, firma y sello.\n**5 ·** Se lleva su informe.\n\n**No se guarda ninguna referencia externa**, porque no hay otra empresa\ninvolucrada. El laboratorio es dueño de todo, de punta a punta.\n\nY si mañana ese mismo señor vuelve a la sede de afuera, es el mismo `L-000789`:\nuna sola empresa, un solo expediente.\n\n---\n\n## 5. Llegó primero al laboratorio y después al hospital\n\n**Este es el caso que motivó todo el diseño**, y el único donde la identidad hay\nque resolverla de verdad.\n\nSaid se hizo un hemograma por su cuenta en marzo. En septiembre llega al hospital\ncon otra cosa, y el médico necesita ver ese resultado.\n\n**1 · Admisión en el hospital.** Nace `H-000999`. El hospital no sabe nada del\nlaboratorio.\n\n**2 · El médico pide el historial.** El hospital **no tiene referencia guardada**\n—nunca pasaron juntos— así que pregunta:\n\n> *Soy el Hospital San José. Mi paciente `H-000999`: documento 0801-2004-00844,\n> nacido en 2004, Said Hoch. ¿Lo conocés?*\n\n**3 · El cotejo lo hace el laboratorio, contra lo suyo.** Documento y año de\nnacimiento coinciden con `L-000789`. Dos factores: no hay ambigüedad.\n\nEl hospital **nunca vio el registro de pacientes del laboratorio**. No eligió de\nuna lista. No adivinó. Preguntó y le contestaron.\n\n**4 · El laboratorio devuelve tres cosas:**\n\n- El historial que corresponde compartir (sección 6)\n- **Su expediente `L-000789`**, para que el hospital lo anote\n- El aviso de si hay algo que no pudo confirmar\n\n**5 · Nace el par de referencias, sin que nadie haga nada extra.** El hospital\nanota `L-000789`; el laboratorio anota `H-000999`.\n\n**6 · De aquí en adelante todo es automático.** La próxima consulta del historial\ny la próxima orden van por el nivel 1.\n\n> **ABIERTO** — Anotar la referencia significa que el laboratorio ahora sabe que\n> ese paciente también se atiende en el hospital. Es información sobre la persona,\n> no sobre su salud, y es la misma que obtendría con la primera orden. Queda\n> escrito para que sea una decisión y no un descuido. *(H-75)*\n\n### Si el cotejo no alcanza\n\nSin documento, o con datos que no cuadran, el laboratorio contesta **«no puedo\nconfirmar»** y no devuelve nada. No se crea referencia.\n\nEl médico ve ese aviso y sabe que tiene que preguntarle al paciente. Cuando el\npaciente vaya a la ventanilla con una orden, la recepcionista confirma con él\ndelante y ahí nace el par. Nunca antes.\n\n---\n\n## 6. Qué se comparte, exactamente\n\nNo todo lo que el laboratorio tiene sobre un paciente es del hospital.\n\n| | ¿Se comparte? | Por qué |\n|---|---|---|\n| Lo que **este hospital** ordenó | **Sí** | Ya es suyo: él lo pidió y él lo paga |\n| Lo que el paciente se hizo **por su cuenta** | **Sí** | Es el requisito clínico: el médico tiene que poder diagnosticar bien |\n| Lo que el laboratorio hizo **para otra clínica** | **No** | El resultado es del laboratorio, pero **el hecho de que exista una orden es de quien la pidió**. Mostrarlo le dice al hospital dónde más se atiende el paciente, y eso no es del laboratorio darlo |\n\n> **REGLA** — `F6-5` · El laboratorio comparte lo que este hospital ordenó y lo que\n> el paciente se hizo directamente. Lo que ordenó un tercero, no — salvo que el\n> paciente lo pida.\n\n> **REGLA** — `F6-6` · **Toda consulta de historial queda registrada**: quién\n> preguntó, por qué paciente y cuándo. No se bloquea al médico, pero queda rastro.\n> Es lo que un hospital hace con su propia historia clínica por dentro.\n\n---\n\n## 7. El día normal, que es el que importa\n\nCon las dos referencias ya anotadas, así se ve una atención cualquiera:\n\n```\n  El médico abre la ficha del paciente\n      └─ el historial del laboratorio ya está ahí          (nivel 1, instantáneo)\n\n  Pide un hemograma\n      └─ la orden aparece en la ventanilla                 (sin aceptar nada)\n\n  El paciente camina veinte metros\n      └─ le sacan sangre                                   (ya está identificado)\n\n  El bioquímico valida y firma\n      └─ el resultado aparece en la pantalla del médico    (atado a la orden)\n```\n\n**Nadie aceptó nada. Nadie buscó a nadie. Nadie eligió de una lista.**\n\nLa única fricción de todo el modelo ocurrió una vez, en la primera visita de ese\npaciente, en un mostrador donde de todos modos había que atenderlo.\n\n---\n\n## 8. Qué puede fallar\n\n**El hospital fusiona dos fichas suyas** que resultaron ser la misma persona, y\ncada una tenía una referencia distinta al laboratorio. Eso significa que **el\nlaboratorio también tiene dos**. Hay que avisarle, o el laboratorio va a seguir\npartiendo el historial en dos. No es difícil, pero si no se escribe aparece solo.\n*(H-74)*\n\n**Una referencia se confirmó mal.** Alguien confirmó al paciente equivocado en la\nventanilla. El daño existe, pero es local: la empresa que la escribió la borra, y\nnadie más se enteró. Compará con una identidad compartida, donde el mismo error\nlo heredan las dos y hay que negociarlo.\n\n**El laboratorio corrige un resultado ya enviado.** Tiene que salir un mensaje de\ncorrección, no una edición silenciosa. Si el hospital ya imprimió el anterior,\nalguien tiene que saber que cambió.\n\n**El paciente sin documento.** Cae siempre en el nivel 3. Es el único caso donde\nla fricción se repite, y es correcto que se repita: no hay nada que cotejar.\n\n**Se rompe la relación entre las dos empresas.** El laboratorio se muda, o el\ncontrato se termina. Cada uno ya tiene todo lo suyo; las referencias quedan como\ntexto muerto y se borran. **No hay nada que repartir** — que es exactamente lo que\nun modelo de datos compartidos no puede prometer.\n\n---\n\n## 9. Lo que falta reconciliar\n\nEste documento ya es la referencia. Lo de abajo es lo que quedó desactualizado y\nhay que poner al día — está anotado como `H-73` para que no se pierda.\n\nNada de esto se toca todavía: **la forma exacta se define aparte.**\n\n| Qué | Estado |\n|---|---|\n| `plataforma.persona` y `plataforma.conflicto_identidad` | **Sobran.** El cotejo pasa a ser local y por consulta |\n| `plataforma.vincular_persona()` y las cinco funciones de identidad | Sobran con ellas. Son 511 líneas entre `07_identidad.sql` y sus pruebas |\n| `core.paciente.persona_id` | Se reemplaza por la referencia externa, que es texto y no llave |\n| `audit.derivacion` | **Se reemplaza por `core.mensaje`**: una fila de cada lado, con su propio `empresa_id` y la RLS de todas. Deja de necesitar `persona_id`, su `datos_compartidos` pasa a ser el contenido, y los estados dejan de negociar. La forma está en `01-la-empresa.md` 2.8 |\n| `rls_derivacion` | Desaparece la única política del sistema que compara contra dos empresas |\n| `core.empresa_asociada` | **Se retira, y no se reemplaza por nada a nivel de empresa.** Entra `plataforma.enlace`: una fila por ruta **entre dos sedes**, creada por el operador. Unir empresas era demasiado grueso — si el laboratorio tiene dos sedes y solo una está adentro del hospital, un vínculo empresa a empresa le manda trabajo a la otra. Tampoco colapsa dentro de `core.convenio` como se pensaba aquí: el convenio modela quién te manda pacientes y paga, y el hospital no tiene convenio hacia su proveedor. Decidido en `H-78`; el hueco que lo obliga está en `H-76` |\n| `core/05-la-identidad.md` | Cambia de tema: de «la identidad compartida» a «cómo cada empresa reconoce a su propio paciente» |\n| `E-1` | Pasa a ser verdad **sin excepciones**: toda fila pertenece a exactamente una empresa |\n\nEse último renglón es el que mide si el modelo es bueno. Hoy `E-1` tiene una\nexcepción declarada y dos sin declarar. Con esto, ninguna.\n", "flujos/07-como-se-entra.md": "# Cómo se entra\n\nQué pasa desde que alguien escribe su usuario y su clave hasta que ve datos en\npantalla, y por qué esos datos son los suyos y no los de otro laboratorio.\n\nEste flujo atraviesa las tres capas —Angular, NestJS y PostgreSQL— y es el único\ndonde las tres tienen algo que decir sobre lo mismo. También es donde se ve por qué\nel aislamiento no depende de que nadie se equivoque.\n\n---\n\n## 1. Qué dispara este flujo\n\nUna persona abre la aplicación y no tiene sesión: es la primera vez del día, se le\nvenció la anterior, o la cerró a propósito.\n\nDelante de la pantalla hay un usuario del laboratorio: recepción, un técnico, el\nbioquímico, el administrador. **Nunca el operador de la plataforma** — ese entra\npor otro lado, con otra credencial y sobre el esquema `comercial` (`E-19`), y ese\nflujo no existe todavía (`H-16`).\n\n---\n\n## 2. Antes de empezar\n\nTiene que existir:\n\n- La empresa, con `nivel_acceso` distinto de `bloqueado` y sin `fecha_cierre` vencida. **No se mira el estado**, se mira el nivel (`F7-10`).\n- El empleado, en `core.empleado`.\n- El usuario, en `core.usuario`, con `estado = 'activo'` y un `password_hash` de\n  verdad. **Hoy los usuarios nacen con el texto `SIN_CLAVE_PENDIENTE_ACTIVACION`**,\n  que no es el hash de nada: no existe el alta de clave (`H-17`). Para las pruebas,\n  `08_login.sql` les pone una clave real.\n- Al menos una fila en `core.acceso_sucursal`, o el usuario entra sin poder elegir\n  dónde trabaja.\n- Del lado técnico: `JWT_SECRETO` en el `.env` del API, y el rol `lis_api` creado\n  en la base.\n\n---\n\n## 3. El camino normal\n\n### 3.1 Los pasos\n\n**1 · La pantalla manda las credenciales.**\n\n```\nPOST /auth/login    { username, password }\n```\n\nEs la **única ruta abierta** del API. El guard está puesto de forma global, así que\ntodo pide token salvo lo marcado con `@Publico()` — y eso es a propósito: al revés,\nprotegiendo ruta por ruta, el día que alguien olvide el decorador queda un endpoint\nabierto y nadie se entera. Así, olvidarse significa quedar cerrado de más, que se\nnota en el acto.\n\n> **REGLA** — `F7-1` · **El guard es global y las excepciones se declaran.** Una ruta\n> nueva nace protegida. Abrirla es un acto explícito, escrito con `@Publico()`.\n\n**2 · El API busca la credencial, y aquí hay un huevo y una gallina.**\n\nAl entrar todavía no se sabe de qué empresa es quien escribe, así que no hay\ncontexto que poner — y sin contexto, RLS le tapa `core.usuario` entera a `lis_app`:\nuna consulta normal devuelve cero filas y no hay de dónde sacar el `empresa_id`.\n\nPor eso existe `core.buscar_credencial()`, `SECURITY DEFINER`: corre con los\nprivilegios de su dueño y se salta RLS. Es una grieta hecha a propósito, y por eso\nestá acotada — devuelve una sola fila, no acepta filtros libres, tiene el\n`search_path` fijo y solo `lis_app` la puede ejecutar.\n\n> **REGLA** — `F7-2` · **`core.buscar_credencial()` es el único punto donde se lee\n> `core.usuario` sin sesión puesta.** Cualquier otra lectura sin contexto devuelve\n> cero filas, y así tiene que seguir.\n\n**3 · Se verifica la clave, en la aplicación y nunca en SQL.**\n\n```typescript\nconst buena = await argon2.verify(cred.password_hash, dto.password);\n```\n\nCompararla en SQL la deja escrita en el registro de consultas de PostgreSQL y abre\nla puerta a medir por tiempo de respuesta. El hash sale de la base; la comparación\nocurre en Node.\n\n**4 · Se decide, y todos los rechazos dicen lo mismo.**\n\nEn orden: nivel de acceso de la empresa, fecha de cierre, estado del usuario, y por\núltimo la clave. Pero el mensaje que sale para «no existe ese usuario» y para «la clave está\nmal» es **idéntico**.\n\n> **REGLA** — `F7-3` · **Usuario inexistente y clave equivocada dan la misma\n> respuesta.** Distinguirlos le regala a un atacante una lista de usuarios válidos:\n> prueba nombres y mira cuál contesta distinto.\n\n**5 · Se firma el token.** Aquí el `empresa_id` que salió de la **base** queda\nsellado. De ahora en adelante viaja dentro del token y nadie lo puede cambiar sin\nromper la firma.\n\n**6 · Se arma lo que la pantalla necesita**, ya con sesión puesta y RLS activo: las\nsucursales donde el usuario puede entrar y sus permisos efectivos. Se actualiza\n`ultimo_acceso_en` y se pone `intentos_fallidos` en cero.\n\n**7 · El front guarda la sesión** y a partir de ahí el `tokenInterceptor` le pega la\ncabecera a cada petición.\n\n### 3.2 Qué es el token, en concreto\n\nTres partes separadas por puntos, y las dos primeras son **base64, no cifrado**:\n\n```\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 . eyJzdWIiOiIxIiwiZW1wIjoiMSIs... . CJqOwJnu3u8BFr6n...\n└────────── cabecera ──────────────┘   └────────── contenido ──────┘   └───── firma ─────┘\n\ncabecera   {\"alg\":\"HS256\",\"typ\":\"JWT\"}\ncontenido  {\"sub\":\"1\",\"emp\":\"1\",\"usr\":\"carla.nunez\",\"rol\":\"Recepcion\",\"exp\":1789707504}\n```\n\n**Cualquiera lo puede leer.** Eso no es un fallo: es el diseño. Lo que no se puede\nes **cambiarlo**, porque la firma se calcula con el contenido más un secreto que\nsolo tiene el servidor. Comprobado: cambiar `emp` de `1` a `2` dejando la firma\nvieja da `JsonWebTokenError: invalid signature`.\n\nDe ahí sale la regla que sostiene todo el aislamiento:\n\n> **REGLA** — `F7-4` · **El `empresa_id` sale del token verificado, nunca del cuerpo\n> de la petición ni de un parámetro de la URL.** Si el API aceptara un\n> `?empresaId=2`, cualquiera lo cambia en la barra del navegador y RLS lo dejaría\n> pasar tan tranquilo — porque RLS obedece el contexto que le pongan. RLS protege\n> contra el `WHERE` olvidado, no contra un API que le cree al navegador.\n\nY su consecuencia inmediata:\n\n> **REGLA** — `F7-5` · **En el token no va nada secreto.** Va quién sos, no tu clave\n> ni ningún dato clínico. Si alguien lo lee, aprende que Carla es recepcionista de\n> la empresa 1 — que ya lo sabía, porque es ella.\n\n**El back no lo almacena.** Ni una tabla, ni Redis, ni un archivo. Firma y olvida;\ncuando llega una petición, **recalcula** la firma y compara. Es un sello de lacre:\nno hace falta un registro de qué cartas sellaste, mirás el sello y sabés si es tuyo.\n\n### 3.3 Las tres paredes\n\nUna petición cualquiera, ya con token, choca con tres controles distintos. Cada uno\ncontesta una pregunta que los otros no saben contestar:\n\n| | Pregunta | Dónde vive | Cómo falla |\n|---|---|---|---|\n| **1 · RLS** | ¿De qué empresa son estas filas? | política de cada tabla | silencio: cero filas |\n| **2 · Permiso** | ¿Este rol puede hacer esta acción? | `core.usuario_puede()` | error, el que llama decide |\n| **3 · Sesión** | ¿Esta sesión todavía vale? | `core.sesion_vigente()` | error `28000` con mensaje |\n| **3b · Nivel** | ¿Y hasta dónde llega el acceso de la empresa? | `core.puede_crear()`, `core.puede_modificar()` | error `42501` con mensaje |\n\nLa tercera pared son en realidad tres funciones, porque **el acceso de una\nempresa no es un sí o un no**:\n\n| `nivel_acceso` | SELECT | INSERT | UPDATE | lo que promete el enumerado |\n|---|---|---|---|---|\n| `completo` | sí | sí | sí | todo lo que el producto ofrece |\n| `solo_cierre` | sí | **no** | sí | terminar lo abierto; nada nuevo |\n| `solo_lectura` | sí | **no** | **no** | consultar y exportar; nada más |\n| `bloqueado` | **no** | **no** | **no** | no se entra |\n\nMedido, no supuesto: esa tabla es la salida de la prueba, y coincide línea por\nlínea con lo que el enumerado prometía desde el principio.\n\n**Y una decisión que vale explicar: estas funciones miran `nivel_acceso`, nunca\n`estado`.** Son dos cosas distintas que estaban confundidas — `estado_empresa`\n(`prueba`, `activa`, `suspendida`, `cancelada`, `cerrada`) es el **hecho\ncomercial**, el porqué; `nivel_acceso` es la **consecuencia**, el qué puede\nhacer. El LIS no tiene por qué saber si un laboratorio está suspendido por mora\no cancelado por decisión propia: eso lo traduce el lado comercial a un nivel,\nque es lo único que cruza la frontera (`E-18`). Leer `estado` aquí era duplicar\nuna decisión ya tomada, con una lista escrita a mano que se rompe cada vez que\nnace un estado nuevo.\n\nLas tres viven **en la base**. Ninguna depende de que el API se acuerde de\ncomprobar, y por eso alcanzan también a las consultas que nadie ha escrito todavía.\n\n**Por qué la primera calla y la tercera grita.** No es inconsistencia, es la\ndistinción que las separa:\n\n- «Esta fila es de otra empresa» es una condición **de fila**. Un error delataría\n  que la fila existe. El silencio no filtra nada.\n- «Tu sesión ya no vale» es una condición **de sesión**. No hay nada que filtrar —\n  es sobre quien pregunta, y necesita enterarse.\n\n> **REGLA** — `F7-6` · **Una condición de fila calla; una condición de sesión\n> avisa.** El silencio es correcto cuando hablar delataría la existencia de algo.\n> Cuando no hay nada que delatar, callar solo confunde.\n\n### 3.4 Cómo se escriben las políticas\n\nCada tabla lleva **tres** políticas, no una — `FOR SELECT`, `FOR INSERT` y\n`FOR UPDATE` — porque es la única forma de que `solo_cierre` y `solo_lectura`\nsignifiquen algo. Con una sola política `FOR ALL`, leer y escribir eran la\nmisma cosa y esos dos niveles eran palabras del enumerado que nadie hacía\ncumplir:\n\n```sql\nFOR SELECT USING      (empresa_id = (SELECT core.empresa_actual())\n                       AND (SELECT core.sesion_vigente()))\n\nFOR INSERT WITH CHECK (empresa_id = (SELECT core.empresa_actual())\n                       AND (SELECT core.sesion_vigente())\n                       AND (SELECT core.puede_crear()))\n\nFOR UPDATE USING      (empresa_id = (SELECT core.empresa_actual())\n                       AND (SELECT core.sesion_vigente()))\n           WITH CHECK (empresa_id = (SELECT core.empresa_actual())\n                       AND (SELECT core.sesion_vigente())\n                       AND (SELECT core.puede_modificar()))\n```\n\n**No hay `FOR DELETE`, y eso también es a propósito.** Sin política, `DELETE`\nqueda prohibido — y además está revocado. Dos candados sobre la misma puerta.\n\nLa única excepción a la tabla de niveles es `audit.evento`: su `INSERT` solo\npide sesión vigente, sin `puede_crear()`. Dejar constancia de lo que pasó no\npuede depender de si el cliente está al día con su pago.\n\nY los paréntesis **no son estilo**:\n\nEnvuelta en `(SELECT ...)`, PostgreSQL evalúa la función como **InitPlan**: una vez\npor consulta. Escrita suelta la trata como filtro **por fila** y la llama una vez\npor cada una. Medido sobre 300.000 filas con 100.000 propias:\n\n| Política | ms |\n|---|---|\n| `empresa_actual()` suelta | 51.4 |\n| `(SELECT empresa_actual())` envuelta | 21.6 |\n| envuelta **más** `(SELECT sesion_vigente())` | **21.6** |\n| las dos sueltas | 894.7 |\n\nLa comprobación de sesión **sale gratis** si está envuelta, y es diecisiete veces\nmás lenta si no. El paréntesis es la diferencia entre que sea viable o imposible.\n\n> **REGLA** — `F7-7` · **Toda función dentro de una política va envuelta en\n> `(SELECT ...)`.** Sin eso se ejecuta una vez por fila.\n\n`core.sesion_vigente()` es `SECURITY DEFINER` por una razón concreta: lee\n`core.usuario` y `core.empresa`, que tienen RLS. Si corriera con los privilegios de\nquien llama, la política de `core.usuario` la invocaría a ella, que leería\n`core.usuario`, que aplicaría la política… hasta `stack depth limit exceeded`. Como\n`DEFINER` se salta RLS al leer, y el ciclo no arranca.\n\n### 3.5 El recorrido completo de una petición posterior\n\n```\n[NAVEGADOR]  pacientes.component\n                ↓\n             ApiService.get\u003cPaciente[]>('pacientes')\n                ↓\n             token.interceptor.ts    Authorization: Bearer eyJ...\n                ↓\n════════════════ la red ════════════════\n                ↓\n[NEST]       jwt.guard.ts            verifyAsync()  → si la firma no cuadra, 401\n                └ req.sesion = { usuarioId, empresaId, ... }   NACE LA SESIÓN\n                ↓\n             pacientes.controller.ts   @SesionActual() sesion\n                ↓\n             pacientes.service.ts      prisma.conSesion(sesion, ...)\n                ↓\n             prisma.service.ts    BEGIN\n                                  SET LOCAL ROLE lis_app\n                                  set_config('lis.empresa_id', '1', true)\n                                  SELECT ... FROM core.paciente      ← sin WHERE\n                ↓\n════════════════ PostgreSQL ════════════════\n             rls_paciente agrega, invisible:\n               WHERE empresa_id = (SELECT core.empresa_actual())\n                 AND (SELECT core.sesion_vigente())\n                                  COMMIT\n                ↑  solo los de Laboratorio Ochoa\n```\n\n**El `empresa_id` hace todo el camino sin que el navegador lo toque nunca.** Sale de\nla base al firmar, viaja sellado, y vuelve a la base como contexto de RLS.\n\nY mirá lo que **no** hay en `pacientes.service.ts`: ningún `where: { empresa_id }`.\nEse es el premio. En toda la aplicación no se escribe `empresa_id` una sola vez, y\naun así es imposible que una empresa vea a otra.\n\n> **REGLA** — `F7-8` · **La sesión no se usa para filtrar: se usa para poner el\n> contexto.** El filtro lo agrega PostgreSQL. Un servicio que escriba\n> `where empresa_id` está haciendo a mano lo que la base ya garantiza, y el día que\n> se olvide nadie lo va a notar.\n\n---\n\n## 4. Los desvíos\n\n**La clave está mal.** Sube `intentos_fallidos` y al llegar a cinco el usuario queda\n`bloqueado`. El mensaje es el mismo que para un usuario inexistente (`F7-3`). El\ntope está escrito a mano en el código, no en ninguna tabla de configuración.\n\n**El usuario está `suspendido` o `bloqueado`.** No entra, y aquí sí el mensaje es\nespecífico: es información que necesita para saber a quién pedirle ayuda.\n\n**La empresa no está activa.** Tampoco entra, con `HINT = contactar al operador`.\n\n**El mismo username existe en dos empresas.** `core.buscar_credencial()` **lanza** en\nvez de elegir una:\n\n```\nEl usuario carla.nunez existe en 2 empresas: hace falta decir en cual entra (H-101)\n```\n\nEl índice único es `(empresa_id, lower(username))`: el username es único **dentro**\nde la empresa, no en el sistema. Mientras no se decida cómo se sabe la empresa antes\nde entrar, `LoginDto.empresaId` es opcional y solo se usa para desempatar.\n\n> **REGLA** — `F7-9` · **Ante dos credenciales posibles, el sistema no elige:\n> falla.** Adivinar significaría meter a alguien en la empresa equivocada.\n\n**La sesión se revoca mientras está abierta.** El administrador desactiva a alguien\nque ya entró. El token sigue firmado y válido —no se puede revocar—, pero la\nsiguiente consulta choca con `core.sesion_vigente()`:\n\n```\nERROR:  28000: Sesion caducada: el usuario esta suspendido\nHINT:   volver a entrar\n```\n\nEl `ErroresBaseFilter` lo convierte en un 401, el `errorInterceptor` de Angular ve\nel 401, cierra la sesión y manda al login. La cadena completa, desde un `UPDATE` del\nadministrador hasta la pantalla de la recepcionista.\n\n**Con una salvedad medida**: la política solo se evalúa si la tabla tiene al menos\nuna fila que filtrar. Sobre una tabla vacía, el usuario desactivado recibe cero\nfilas en silencio en vez del mensaje. **La garantía no cambia** —nunca ve datos—;\nlo que no está garantizado es que siempre se entere por qué.\n\n---\n\n## 5. Qué queda en la base al terminar\n\nUn login correcto toca **una sola fila**:\n\n| Tabla | Columna | Qué queda |\n|---|---|---|\n| `core.usuario` | `ultimo_acceso_en` | `now()` |\n| `core.usuario` | `intentos_fallidos` | `0` |\n\nUn login fallido toca la misma fila: sube `intentos_fallidos` y, al llegar al tope,\ncambia `estado` a `bloqueado`.\n\n**Y no queda nada más.** No hay tabla de sesiones, no hay registro de tokens\nemitidos, y **`audit.evento` no registra ni la entrada ni el intento fallido**. Eso\nes un hueco: hoy no se puede contestar «¿quién entró a esta empresa y cuándo?» más\nallá del último acceso, que se sobrescribe.\n\n---\n\n## 6. Qué puede fallar\n\n- `H-17` — No existe el alta de clave. Los usuarios nacen con un texto que no es un\n  hash y el estado `pendiente_activacion` no existe en el enumerado. **Hoy nadie\n  puede entrar sin que alguien le ponga la clave a mano.**\n- `H-101` — El username es único por empresa, no en el sistema. Falta decidir cómo\n  se sabe la empresa antes de entrar: subdominio, código de empresa, o correo único.\n- `H-103` — El token no se puede revocar. Resuelto desde la base con\n  `core.sesion_vigente()`, pero el token en sí sigue siendo válido: si alguna vez se\n  filtrara, el único freno es cambiar `JWT_SECRETO`, que echa a todo el mundo.\n- `H-104` — Las políticas estaban sin envolver y costaban 2.4× de más. Arreglado, y\n  con el efecto secundario del silencio sobre tablas vacías.\n- `H-100` — De los cinco niveles de comprobación, `core.acceso_sucursal` y\n  `core.sucursal.activo` siguen sin leerse. Un usuario con **cero** accesos opera en\n  cualquier sede de su empresa. El nivel de la empresa, sus cuatro grados y su\n  fecha de cierre **ya se comprueban**: `sesion_vigente()`, `puede_crear()` y\n  `puede_modificar()`. `E-20` dejó de ser una regla sin mecanismo.\n- **El tope de intentos está escrito a mano** en `auth.service.ts`, no en\n  configuración.\n- **Ni el intento fallido ni el bloqueo escriben en `audit.evento`.**\n- **El token vive en `localStorage`**, legible por cualquier JavaScript de la página.\n  La alternativa —cookie `httpOnly`— lo esconde del JavaScript pero trae CSRF y\n  exige HTTPS. Sin decidir.\n\n---\n\n## 7. Reglas que este flujo hace cumplir\n\n- `E-19` — Las dos administraciones no se mezclan: este flujo es solo para usuarios\n  del laboratorio.\n- `E-20` — El nivel de acceso de la empresa se comprueba antes que el permiso del\n  usuario. **Ahora sí tiene mecanismo**: `core.sesion_vigente()` mira el estado y la\n  fecha de cierre.\n- `F7-1` — El guard es global; las excepciones se declaran.\n- `F7-2` — `core.buscar_credencial()` es el único punto donde se lee `core.usuario`\n  sin sesión.\n- `F7-3` — Usuario inexistente y clave equivocada dan la misma respuesta.\n- `F7-4` — El `empresa_id` sale del token verificado, nunca de la petición.\n- `F7-5` — En el token no va nada secreto.\n- `F7-6` — Una condición de fila calla; una condición de sesión avisa.\n- `F7-7` — Toda función dentro de una política va envuelta en `(SELECT ...)`.\n- `F7-8` — La sesión pone el contexto, no filtra.\n- `F7-9` — Ante dos credenciales posibles, el sistema falla en vez de elegir.\n- `F7-10` — **El LIS lee `nivel_acceso`, nunca `estado`.** El estado es el hecho\n  comercial y su interpretación vive del otro lado de la frontera (`E-18`).\n- `F7-11` — **Leer, crear y modificar son tres permisos distintos, y el nivel de\n  la empresa los reparte.** Por eso cada tabla lleva tres políticas.\n\n---\n\n## 8. Preguntas abiertas\n\n- **¿Cómo se sabe la empresa antes de entrar?** (`H-101`) Subdominio por empresa,\n  código escrito en la pantalla, correo único, o username único en el sistema. Cada\n  una cambia el índice, la pantalla y el despliegue.\n- **¿Dónde vive el token?** `localStorage` o cookie `httpOnly`. Para datos clínicos\n  la cookie es el destino razonable; cuesta CSRF, HTTPS obligatorio y cuatro\n  archivos.\n- **¿Cuánto dura la sesión?** Hoy ocho horas, elegido sin criterio. Un laboratorio\n  con turnos de doce horas necesitaría otra cosa.\n- **¿Se registra la entrada en `audit.evento`?** Hoy no. Para datos clínicos suele\n  ser obligatorio saber quién entró y cuándo.\n- **¿Cómo se elige la sucursal al entrar?** El login devuelve la lista, pero nada\n  decide cuál se usa, y `lis.sucursal_id` no existe en el contexto (`H-100`).\n- **¿Qué pasa con las sesiones abiertas cuando el operador suspende una empresa?**\n  (`H-3`) **Resuelto, y lo resolvió el enumerado que ya existía**: depende del\n  `nivel_acceso` que el lado comercial le asigne. Con `solo_lectura` el\n  laboratorio sigue consultando y exportando pero no escribe; con `solo_cierre`\n  puede además terminar lo que tenía abierto; con `bloqueado` no entra. Lo que\n  queda por decidir no es el mecanismo sino **qué nivel corresponde a cada\n  motivo** — y eso es `H-13`, del lado comercial.\n\n---\n\n## 9. Dónde vive en el código\n\n**Base de datos**\n\n| Qué | Dónde |\n|---|---|\n| `core.empresa_actual()`, `core.usuario_actual()` | `04_funciones.sql` |\n| `core.sesion_vigente()` — puede entrar | `04_funciones.sql` |\n| `core.nivel_actual()`, `puede_crear()`, `puede_modificar()` | `04_funciones.sql` |\n| `core.crear_usuario()` y las cuatro de activación | `04_funciones.sql` |\n| `core.usuario_puede()`, `core.usuario_puede_en()` | `04_funciones.sql` |\n| `core.buscar_credencial()` | `08_login.sql` — **pendiente de mudar a `04`** |\n| Las políticas (tres por tabla) y los privilegios de `lis_app` | `05_privilegios.sql` |\n| Las ocho pruebas del estreno de contraseña | `93_pruebas_activacion.sql` |\n| Clave real para los usuarios de prueba | `08_login.sql` |\n| Demostración de RLS paso a paso | `96_demo_rls.sql` |\n| Cinco peticiones contra datos reales | `97_peticiones_rls.sql` |\n\n**API — `packages/api/src/`**\n\n| Qué | Dónde |\n|---|---|\n| El tipo `Sesion` y la carga del token | `comun/sesion.ts` |\n| `@SesionActual()` | `comun/sesion.decorador.ts` |\n| `28000` → 401 | `comun/errores.filtro.ts` |\n| `conSesion()` y `sinSesion()` | `prisma/prisma.service.ts` |\n| El guard global | `auth/jwt.guard.ts` |\n| `@Publico()` | `auth/publico.decorador.ts` |\n| El login | `auth/auth.service.ts`, `auth.controller.ts` |\n| CORS y el filtro global | `main.ts` |\n\n**Front — `packages/web/src/`**\n\n| Qué | Dónde |\n|---|---|\n| La URL del API por entorno | `environments/environment*.ts` |\n| Dónde vive la sesión | `app/comun/sesion.service.ts` |\n| La cabecera `Authorization` | `app/comun/token.interceptor.ts` |\n| El 401 → login | `app/comun/error.interceptor.ts` |\n| Los interceptores enchufados | `app/app.config.ts` |\n\n**Lo que se pide crear**\n\n- El alta de clave y el estado `pendiente_activacion` (`H-17`).\n- El registro de la entrada en `audit.evento`.\n- La elección de sucursal y `lis.sucursal_id` en el contexto (`H-100`).\n- La consola del operador, con su propio flujo de entrada (`H-16`).\n"};

const _fetch = window.fetch ? window.fetch.bind(window) : null;
