<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProLisSaas · Documentación</title>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#0F1820; --ink-2:#3C4A56; --muted:#66757F;
  --line:#D8DFE5; --line-2:#C3CCD4;
  --accent:#10466E; --accent-soft:#E3ECF3;
  --ok:#2F7358; --pend:#9A742A; --bad:#A63D3D; --abierto:#3F7EA6;
  --tint:#EAF0F4;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1116; --surface:#141C22; --surface-2:#111920;
    --ink:#E4EBF1; --ink-2:#B7C4CE; --muted:#8C9AA6;
    --line:#25313A; --line-2:#31404B;
    --accent:#63A2D4; --accent-soft:#16283A;
    --ok:#5A9E80; --pend:#C0994F; --bad:#C96A6A; --abierto:#6BA6C9;
    --tint:#182229;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased;}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:274px minmax(0,1fr);height:100vh;}
/* En ventana angosta la lista se pone arriba, no se esconde. Antes era
   `display:none` y no quedaba ninguna forma de cambiar de documento. */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
  .side{border-right:none;border-bottom:1px solid var(--line);max-height:44vh;padding-bottom:12px;}
}

/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:0 0 40px;}
.side header{padding:22px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;}
.side h1{margin:0 0 3px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.side .sub{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.side .estado{margin-top:12px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;}
.dot.off{background:var(--bad)}
.grupo{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:20px 20px 7px;}
.side nav a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  text-decoration:none;color:var(--ink-2);font-size:13.4px;padding:6px 20px 6px 18px;
  border-left:2px solid transparent;line-height:1.35;}
.side nav a:hover{color:var(--accent);background:var(--surface-2);}
.side nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600;}
.pct{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;}
.pct.full{color:var(--ok)}
.pct.zero{color:var(--pend)}
.barra{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;}
.barra i{display:block;height:100%;background:var(--accent);}

/* ---------- main ---------- */
main{overflow-y:auto;padding:0 0 100px;}
.doc{max-width:860px;margin:0 auto;padding:44px 40px 0;}
@media (max-width:640px){.doc{padding:28px 20px 0}}
.aviso{max-width:760px;margin:60px auto;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--bad);border-radius:3px;padding:24px 28px;}
.aviso h2{margin:0 0 10px;font-size:19px;}
.aviso code{display:block;background:var(--tint);padding:10px 14px;border-radius:3px;margin:12px 0;font-family:var(--mono);font-size:13px;}

/* ---------- markdown ---------- */
.md h1{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px;}
.md .lead{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 28px;}
.md h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:44px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.md h3{font-size:16px;font-weight:600;margin:30px 0 8px;}
.md h4{font-size:13px;font-weight:600;margin:22px 0 6px;color:var(--ink-2);font-family:var(--mono);letter-spacing:.02em;}
.md p{margin:0 0 14px;}
.md ul,.md ol{margin:0 0 14px;padding-left:24px;}
.md li{margin:0 0 5px;}
.md li>ul,.md li>ol{margin-top:5px;}
.md code{font-family:var(--mono);font-size:.87em;background:var(--tint);padding:1.5px 5px;border-radius:2px;}
.md pre{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:3px;padding:14px 16px;overflow-x:auto;margin:14px 0;}
.md pre code{background:none;padding:0;font-size:12.4px;line-height:1.65;}
.md blockquote{margin:14px 0;padding:12px 16px;background:var(--surface);border-left:2px solid var(--line-2);
  border-radius:0 3px 3px 0;color:var(--ink-2);}
.md blockquote p:last-child{margin:0}
.md blockquote.pendiente{border-left-color:var(--pend);background:var(--surface-2);}
.md blockquote.pendiente strong:first-child{color:var(--pend);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;}
.md blockquote.abierto{border-left-color:var(--abierto);}
.md blockquote.abierto strong:first-child{color:var(--abierto);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;}
.md blockquote.riesgo{border-left-color:var(--bad);}
.md blockquote.riesgo strong:first-child{color:var(--bad);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;}
.md blockquote.regla{border-left-color:var(--ok);}
.md blockquote.regla strong:first-child{color:var(--ok);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;}
.md hr{border:none;border-top:1px solid var(--line);margin:32px 0;}
.md a{color:var(--accent);}
.md table{border-collapse:collapse;width:100%;font-size:13.4px;margin:14px 0;}
.md .tw{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface);margin:14px 0;}
.md .tw table{margin:0;}
.md th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line-2);background:var(--surface-2);}
.md td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);line-height:1.5;}
.md tr:last-child td{border-bottom:none;}
.md td:first-child{color:var(--ink);}
.md strong{font-weight:600;color:var(--ink);}
</style>
</head>

const EMBEBIDO = {"indice.json": "{\n  \"proyecto\": \"ProLisSaas\",\n  \"grupos\": [\n    {\n      \"nombre\": \"Cómo se usa esto\",\n      \"docs\": [\n        {\n          \"ruta\": \"00-como-leer.md\",\n          \"titulo\": \"Cómo leer y escribir aquí\"\n        },\n        {\n          \"ruta\": \"glosario.md\",\n          \"titulo\": \"Glosario\"\n        },\n        {\n          \"ruta\": \"hallazgos.md\",\n          \"titulo\": \"Hallazgos y errores\"\n        }\n      ]\n    },\n    {\n      \"nombre\": \"Core · territorios\",\n      \"docs\": [\n        {\n          \"ruta\": \"core/00-panorama.md\",\n          \"titulo\": \"Panorama de core\"\n        },\n        {\n          \"ruta\": \"core/01-la-empresa.md\",\n          \"titulo\": \"La empresa\"\n        },\n        {\n          \"ruta\": \"core/02-la-sucursal.md\",\n          \"titulo\": \"La sucursal\"\n        },\n        {\n          \"ruta\": \"core/03-la-gente.md\",\n          \"titulo\": \"La gente que trabaja\"\n        },\n        {\n          \"ruta\": \"core/04-el-paciente.md\",\n          \"titulo\": \"El paciente\"\n        },\n        {\n          \"ruta\": \"core/05-la-identidad.md\",\n          \"titulo\": \"La identidad compartida\"\n        },\n        {\n          \"ruta\": \"core/06-por-donde-entra.md\",\n          \"titulo\": \"Por dónde entra\"\n        },\n        {\n          \"ruta\": \"core/07-la-visita.md\",\n          \"titulo\": \"La visita\"\n        },\n        {\n          \"ruta\": \"core/08-el-documento.md\",\n          \"titulo\": \"El documento\"\n        },\n        {\n          \"ruta\": \"core/09-el-rastro.md\",\n          \"titulo\": \"El rastro\"\n        }\n      ]\n    },\n    {\n      \"nombre\": \"Flujos conjuntos\",\n      \"docs\": [\n        {\n          \"ruta\": \"flujos/01-alta-de-un-cliente.md\",\n          \"titulo\": \"Alta de un cliente\"\n        },\n        {\n          \"ruta\": \"flujos/02-alta-de-personal.md\",\n          \"titulo\": \"Alta de personal\"\n        },\n        {\n          \"ruta\": \"flujos/03-admision-de-un-paciente.md\",\n          \"titulo\": \"Admisión de un paciente\"\n        },\n        {\n          \"ruta\": \"flujos/04-derivacion.md\",\n          \"titulo\": \"Derivación entre empresas\"\n        },\n        {\n          \"ruta\": \"flujos/05-emision-y-entrega.md\",\n          \"titulo\": \"Emisión y entrega\"\n        },\n        {\n          \"ruta\": \"flujos/06-el-paciente-entre-dos-empresas.md\",\n          \"titulo\": \"El paciente entre dos empresas\"\n        },\n        {\n          \"ruta\": \"flujos/07-como-se-entra.md\",\n          \"titulo\": \"Cómo se entra\"\n        }\n      ]\n    }\n  ]\n}\n", "00-como-leer.md": "# Cómo leer y escribir aquí\n\nEsta carpeta define **cómo se comporta el sistema**, no cómo está escrito. El esquema\nde base de datos ya existe en `ProLisSaas/packages/db/schema`; aquí se documenta el\nflujo de trabajo que ese esquema tiene que sostener.\n\n## Para qué sirve\n\nTres cosas, en este orden de importancia:\n\n1. **Encontrar errores antes de escribir código.** Describir un flujo con detalle\n   obliga a contestar preguntas que el esquema deja abiertas. Cada vez que una\n   pregunta no tenga respuesta, es un hallazgo.\n2. **Ser el contexto que Claude lee.** Estos documentos van a alimentar el\n   `CLAUDE.md` del proyecto y las reglas por módulo.\n3. **Ser el contrato con quien programe.** Incluido tú dentro de seis meses.\n\n## Cómo está organizado\n\n- **Territorios** (`core/`) — una pieza del núcleo por documento. Cómo vive por su\n  cuenta y cómo vive con las demás.\n- **Flujos** (`flujos/`) — recorridos completos que atraviesan varios territorios.\n  Un territorio dice *qué es la sucursal*; un flujo dice *qué pasa cuando se da de\n  alta un cliente*.\n- **Hallazgos** (`hallazgos.md`) — la lista viva de lo que encontramos roto o sin\n  decidir. Se alimenta de **«Qué puede salir mal»** y **«Preguntas abiertas»** de\n  cada territorio, y de **«Qué puede fallar»** de cada flujo.\n\nCada territorio tiene las mismas once secciones, con los mismos nombres y en el\nmismo orden. Que sean iguales es lo que permite comparar y notar lo que falta.\n\nUn territorio puede **añadir una sección extra** cuando el material lo pide, pero\nnunca quita ni renombra ninguna de las once. Hoy ninguno la usa: `01-la-empresa.md`\nllegó a tener una y se retiró cuando el catálogo de motivos salió del LIS. Por eso **las referencias entre documentos van por nombre y\nnunca por número**: «la sección de reglas propias», no «la sección 6». El número\ndepende de si ese documento añadió algo; el nombre, no.\n\nLas once, en orden:\n\n| # | Sección | Qué contesta |\n|---|---|---|\n| 1 | Qué es y por qué existe | Para qué está aquí esta pieza |\n| 2 | Las tablas y sus campos | El diccionario, leído de la base |\n| 3 | Quién la crea y con qué datos | De dónde salen las filas |\n| 4 | Ciclo de vida y estados | Cómo cambia con el tiempo |\n| 5 | Flujos propios | Los recorridos que empiezan y terminan aquí |\n| 6 | Reglas propias | Lo que siempre es verdad, numerado |\n| 7 | Cómo vive con las demás | Qué da, qué exige, qué pasa si la otra cambia |\n| 8 | Quién puede hacer qué | Los permisos |\n| 9 | Qué puede salir mal | Donde se cazan los problemas |\n| 10 | Preguntas abiertas | Lo que falta decidir |\n| 11 | Dónde vive en el código | Lo que existe y lo que se pide crear |\n\nLa sección **«Las tablas y sus campos»** es el diccionario del territorio: columna\npor columna, con tipo, nulos, valor por defecto, para qué sirve y qué resuelve, más\nlas llaves foráneas en las dos direcciones. Se escribe **leyendo la base**, no de\nmemoria, y separa lo que ya existe de lo que el documento propone crear.\n\n## Qué se copia del laboratorio y qué no\n\nEl laboratorio lleva años trabajando y hace las cosas de una manera. Parte de esa\nmanera es **cómo funciona el trabajo** y hay que respetarla; parte es **cómo se\nsobrevive sin sistema** y no hay que heredarla. Distinguirlas es la mitad del\ntrabajo de estos documentos.\n\nLa pregunta que las separa: *¿por qué lo hacen así?*\n\n- Si la respuesta habla del **paciente, la muestra, el médico o la ley** — es un\n  requisito. El sistema se adapta. «El bioquímico firma cada informe» no se\n  negocia porque responde de él con su colegiación.\n- Si la respuesta habla de **papel, tiempo, memoria o de que alguien se acuerde**\n  — es un parche. El sistema quita la causa, así que no hay que copiar el efecto.\n\nEl ejemplo que originó esta sección: el laboratorio **reinicia su numeración cada\naño**. La razón no es contable ni legal — es que las boletas se escriben a mano, y\ncon lápiz nadie copia un número de nueve caracteres cuatrocientas veces al año.\nCon papel, reiniciar es lo sensato. Con el sistema, el número lo escribe la\nmáquina y su longitud deja de costar nada, así que la razón desaparece y la regla\n`S-11` puede decir lo contrario de lo que hace el laboratorio hoy —sin\ncontradecirlo, porque le quita el problema en vez de negárselo.\n\nUn parche heredado es caro de dos maneras: cuesta construirlo, y después cuesta\nquitarlo porque ya está en las pantallas y en la costumbre.\n\n**Cuando una decisión venga de aquí, se escribe la razón.** No basta con decir\n«el laboratorio lo hace así»: hay que decir por qué lo hace así, porque de eso\ndepende si se copia o no.\n\n## Cómo se llaman las cosas\n\nLas palabras viven en **`glosario.md`**, que es el documento hermano de este. Ahí\nestán la nomenclatura técnica, qué significa cada término y —lo más importante—\ncon cuál no hay que confundirlo.\n\nDos reglas sobre su uso:\n\n1. **Antes de meter una palabra nueva en un documento, se busca en el glosario.**\n   Si no está, se agrega ahí primero.\n2. Cuando la palabra del laboratorio y la de la base no coinciden, **manda la del\n   laboratorio en documentos y pantallas, y la de la base en el código**. El\n   glosario dice cuál es cuál. Lo que no se permite es usar las dos como si fueran\n   intercambiables sin decirlo.\n\nLa confusión que más caro nos ha salido: **«administrador» no es «operador»**. El\nadministrador es un empleado del laboratorio; el operador sos vos, dueño del\nsistema, y no sos usuario del producto. Ver `E-19`.\n\nLa segunda: **«cliente» no es «empresa»**. La empresa es el inquilino —lo que RLS\naísla, lo que tiene sucursales y pacientes—; el cliente es quien firmó y a quien se\nle factura, y vive en `comercial.cliente` (`E-21`). No se usa «cliente» para\n**definir** la empresa, ni para nombrar sus datos o su gente: se dice *el\nadministrador de la empresa*, porque el cliente no tiene administradores, tiene\ncontactos. En prosa coloquial —«el primer cliente», «tu cartera de clientes»— se\nentiende por contexto y se deja.\n\n## Las cuatro marcas\n\nSe escriben como citas y el visor las pinta distinto:\n\n> **PENDIENTE** — Esta sección todavía no está escrita. El visor solo la cuenta\n> como hueco cuando es lo **primero** que aparece bajo el encabezado, así que una\n> sección ya escrita no se castiga por tener preguntas sueltas.\n\n> **ABIERTO** — Una decisión que falta tomar dentro de una sección que ya está\n> escrita. No cuenta contra el avance, pero sí se copia a `hallazgos.md`.\n\n> **REGLA** — Algo que siempre es verdad. Va numerado con la inicial del territorio:\n> `E-1` para empresa, `S-3` para sucursal. Los flujos las citan por ese código.\n\n> **RIESGO** — Algo que puede salir mal, o una decisión que envejece mal. Todo lo\n> que se marque así se copia a `hallazgos.md`.\n\n## Flujos individuales y compartidos\n\nUn **flujo individual** empieza y termina dentro de un territorio: suspender una\nempresa, crear un permiso, desactivar una sucursal. Se escribe en **«Flujos\npropios»** del documento de ese territorio.\n\nUn **flujo compartido** atraviesa varios: dar de alta un cliente toca empresa,\nsucursal, correlativos, convenio, roles, empleado y usuario. Se escribe en\n`flujos/`, y cada territorio implicado lo menciona en su **«Flujos propios»** con\nun enlace.\n\nLa prueba para decidir: *si al describir el flujo tengo que explicar una pieza que\nno es la de este documento, es compartido.*\n\nLos flujos se numeran `F-\u003cprefijo del territorio>-\u003cn>`: `F-E-3` es el tercer flujo\nde la empresa. Los compartidos llevan el número del archivo: `F1-1` es la primera\nregla del flujo `flujos/01`.\n\n## Cómo numerar las reglas\n\n| Territorio | Prefijo |\n|---|---|\n| La empresa | `E-` |\n| La sucursal | `S-` |\n| La gente que trabaja | `G-` |\n| El paciente | `P-` |\n| La identidad compartida | `I-` |\n| Por dónde entra | `C-` |\n| La visita | `V-` |\n| El documento | `D-` |\n| El rastro | `A-` |\n\nUna regla nunca cambia de número. Si deja de valer, se marca como retirada y se\nescribe la que la reemplaza con un número nuevo.\n\n## Cómo ver esto\n\nDoble clic en **`abrir-visor.bat`**. Levanta un servidor local y abre el navegador.\nDeja esa pestaña abierta: se refresca sola cada dos segundos, así que cualquier\ncambio en un `.md` aparece sin que hagas nada.\n\nEl navegador no puede leer archivos del disco directamente por seguridad, por eso\nhace falta el servidor. Abrir `visor.html` con doble clic no funciona.\n", "glosario.md": "# Glosario\n\nLas palabras que usamos, qué significa exactamente cada una y con cuál **no** hay\nque confundirla.\n\nExiste porque la mitad de los errores de diseño que hemos encontrado empezaron por\nuna palabra que dos documentos usaban con dos sentidos. «Administrador» estuvo a\npunto de costarnos un agujero de seguridad, y «prueba» todavía nombra dos cosas\ndistintas.\n\n**Cómo se usa.** Antes de meter una palabra nueva en un documento, se busca aquí.\nSi no está, se agrega aquí primero. Si está con otro sentido, se usa el de aquí o\nse cambia aquí — pero no se usan las dos a la vez.\n\nCada entrada dice, cuando aplica, **cómo se llama en la base**. Ese nombre es el\nque manda para cualquier identificador de código; la palabra en español es la que\nmanda en documentos y pantallas.\n\n---\n\n## Las que más se confunden\n\nEsta tabla es el corazón del glosario. Si solo vas a leer una parte, que sea esta.\n\n| No es lo mismo | Ni esto | La diferencia en una línea |\n|---|---|---|\n| **Operador** | **Administrador** | El operador sos vos, dueño del sistema. El administrador es un empleado del laboratorio. `E-19` |\n| **Empresa** | **Sucursal** | La empresa es el laboratorio como inquilino del sistema; la sucursal es el local donde se atiende |\n| **Cliente** | **Empresa** | El cliente es quien firmó el contrato y a quien le facturás. La empresa es el inquilino del LIS. Un cliente puede tener varias. `E-21` |\n| **RTN de la empresa** | **RTN del cliente** | Con el primero el laboratorio le factura a sus pacientes. Con el segundo vos le facturás a él. Casi siempre el mismo número, y por eso se confunden |\n| **Papel** (contacto) | **Rol** (usuario) | El papel dice para qué llamarle a un contacto del cliente. El rol dice qué puede hacer un usuario dentro del LIS |\n| **Referencia externa** | **Expediente** | El expediente es mi número para este paciente. La referencia externa es el número que le da la otra empresa, anotado en mi ficha |\n| **Empleado** | **Usuario** | El empleado es quien trabaja ahí; el usuario es su cuenta para entrar. Puede haber empleado sin usuario |\n| **`id`** | **Número** | El `id` es interno y nadie lo ve. El número —`LFO-000123`— es el que el paciente tiene en la mano |\n| **Folio** | **Número** | El folio identifica un mensaje entre dos empresas y es un `uuid`. El número identifica una boleta y lo lee un humano |\n| **Derivación** | **Mensaje** | Derivar es lo que hacés: mandar al paciente o lo suyo. El mensaje es la fila con la que se hace, una de cada lado |\n| **Estado** | **Nivel de acceso** | El estado dice en qué punto de la relación comercial está la empresa. El nivel dice qué puede hacer hoy. `E-7` |\n| **Prueba** (examen) | **Prueba** (estado) | Un hemograma es una prueba; una empresa en evaluación está en estado `prueba`. Misma palabra, dos mundos |\n| **Convenio** | **Enlace** | El convenio es un acuerdo de precios y cobro, y lo crea el laboratorio. El enlace es la ruta entre dos sedes de empresas distintas, y lo crea el operador |\n| **Validar** | **Emitir** | Validar es que el bioquímico aprueba un resultado. Emitir es generar el informe con los resultados ya validados |\n| **Muestra** | **Orden** | La orden es lo que se pidió; la muestra es el tubo. Una orden puede necesitar varios tubos |\n| **Anular** | **Borrar** | Anular deja la fila con un motivo. Borrar no existe: `DELETE` está revocado |\n| **Corregir** | **Editar** | Corregir crea una versión nueva y retira la anterior. Editar sobreescribe, y eso aquí casi nunca se permite |\n\n---\n\n## Las personas\n\n### Operador · dueño del sistema\nVos. El que vende y administra el servicio. **No es usuario del producto**, no\ntiene cuenta en ninguna empresa y sus acciones nunca están en el catálogo de\npermisos. Da de alta empresas, acuerda contratos, cobra, suspende. Trabaja desde\nuna aplicación aparte, sobre el esquema `comercial`.\n\n*Nunca se le llama «administrador».* Ver `E-19`.\n\n### Administrador\nUn **empleado del laboratorio** con el rol `Administrador`. Configura *su*\nlaboratorio: crea empleados y usuarios, define roles, abre sucursales, ajusta\nprecios, configura el encabezado de sus informes. Es el techo de lo que el\nproducto ofrece: por encima no hay un «superadministrador», hay otra aplicación.\n\nEn la base: una fila de `core.usuario` con un `rol_id` que apunta a la fila de\n`core.rol` llamada `Administrador`.\n\n### Empleado\nQuien trabaja en el laboratorio. `core.empleado`. Tiene nombre, cargo y, si es\nbioquímico, número de colegiación. **Existe aunque no pueda entrar al sistema**:\nun empleado sin usuario es normal.\n\n### Usuario\nLa cuenta con la que alguien entra. `core.usuario`. Cuelga de un empleado y tiene\nun rol. Estados: `activo`, `suspendido`, `bloqueado`.\n\n### Bioquímico\nEl profesional que **firma** los informes. No es un permiso: es un empleado con\nnúmero de colegiación. Un permiso no convierte a nadie en bioquímico — el sistema\ncomprueba las dos cosas antes de dejar validar.\n\n### Analista\nProcesa muestras y captura resultados. **No los aprueba.** Esa separación es a\npropósito.\n\n### Recepción\nAdmite pacientes, crea órdenes, en un laboratorio chico toma muestras, y entrega\ninformes. Es la puerta de entrada y la de salida.\n\n### Paciente\nA quien se le hacen los exámenes, **dentro de una empresa**. `core.paciente`.\nCada empresa guarda su propia copia del nombre: si una lo escribió mal, el error\nse queda ahí.\n\n### Persona\n*Se retiró.* `plataforma.persona` guardaba la identidad del paciente compartida\nentre empresas, sin nombres, para saber que el de la clínica y el del laboratorio\neran el mismo señor. **Ya no existe**: el modelo decidido no comparte nada entre\nempresas. Cada una anota en su propia ficha cómo la llama la otra — eso es la\n**referencia externa**. `H-73`.\n\n### Referencia externa\nCómo llama la OTRA empresa a mi paciente. `core.paciente_referencia`. Es un dato\nexterno anotado sobre lo propio, como el número de póliza de un seguro: **no es\nllave foránea** hacia el expediente ajeno y no hay integridad referencial entre\nempresas.\n\nNace de una **confirmación humana con el paciente presente**, o de un cotejo de\ndos factores que el sistema resolvió sin dudar. Nunca de elegir en una lista\n(`F6-2`), y por eso el usuario que confirma es obligatorio.\n\nSi se confirmó mal, la anula quien la escribió —con motivo, porque nada se\nborra— y escribe otra. El daño es local: nadie más se entera. Compará con la\nidentidad compartida, donde el mismo error lo heredaban las dos empresas.\n\n### Médico solicitante\nQuien pidió los exámenes. **Hoy no existe en la base**: `core.medico` y\n`core.episodio.medico_solicitante_id` se retiraron (`H-98`). Se decide cuando\nesté armado el flujo de admisión, porque ahí se ve si hace falta una ficha o\nbasta un campo con lo que dice la boleta. Nunca es un usuario del sistema.\n\n---\n\n## Las organizaciones\n\n### Empresa · inquilino\nEl laboratorio como unidad del sistema. `core.empresa`. **Es la unidad de\naislamiento**: todo lo que existe pertenece a una empresa y solo a una.\nEstados: `prueba`, `activa`, `suspendida`, `cancelada`, `cerrada`.\n\n**No es el cliente.** El cliente es quien firmó y a quien se le factura, y vive en\n`comercial`. Casi siempre hay uno de cada uno y por eso se confunden, pero un\ncliente puede tener varias empresas. Ver `E-21`.\n\nSu `rtn` es con el que **ella** le factura a sus pacientes, no la identidad fiscal\nde quien contrató.\n\n### Cliente\nQuien te contrató a vos. `comercial.cliente`. Persona natural o sociedad, con el\nRTN al que le emitís la factura. Vive solo en el esquema `comercial`: el\nlaboratorio no sabe que existe y `lis_app` no tiene un solo privilegio ahí.\n\nUn cliente puede tener **varias empresas** —un grupo con dos laboratorios que no se\nven entre sí— y de ahí cuelga el contrato. La unión es `comercial.cliente_empresa`,\ncon vigencia, porque un laboratorio se puede vender.\n\n**La regla de la palabra.** «Cliente» a secas es `comercial.cliente`. Cuando se\nhabla del inquilino se dice **empresa**, y a su gente se le llama *el administrador\nde la empresa*, nunca «del cliente» — el cliente no tiene administradores, tiene\n**contactos**.\n\nEn prosa coloquial la palabra se entiende por contexto y no hace falta cambiarla:\n«el primer cliente», «tu cartera de clientes», «el cliente avisó con antelación»\nson correctas. Lo que no se hace es usarla para **definir** la empresa ni para\nnombrar sus datos o su gente.\n\n### Contacto\nLa persona a la que se le llama por un cliente. `comercial.contacto`. Varios por\ncliente, cada uno con su **papel**.\n\n### Papel (de un contacto)\nPara qué sirve un contacto: `firma`, `pago`, `tecnico`, `general`. Se llama papel y\n**no rol** a propósito — `rol` ya nombra lo que puede hacer un usuario dentro del\nLIS, y son mundos distintos.\n\n*No confundir con el papel de la boleta*, que en estos documentos aparece más\nseguido: «el bioquímico firma en papel», «la derivación pasa de papel a\nelectrónica». Se distingue por el contexto y siempre lleva «papel **de**» cuando es\nel del contacto.\n\n### Sucursal · sede\nEl lugar físico donde se atiende. `core.sucursal`. **Sede es sinónimo**; el\nnombre que vale para el código es `sucursal`. De aquí cuelgan los correlativos,\nlos precios de sede, los equipos y los accesos del personal.\n\n### Clínica\nEn el caso del primer cliente: **otra empresa**, no una sucursal del laboratorio.\nEl laboratorio vive físicamente dentro de ella, pero son dos entidades legales.\nLlega al sistema por convenio o por derivación.\n\n### Convenio\nEl acuerdo de precios y cobro con quien paga. `core.convenio`. Toda orden tiene\nuno, incluso la del paciente que llega y paga en el mostrador: para eso está el\nconvenio `Particular`, que nace con cada empresa.\n\n### Empresa asociada\n*Se retiró.* `core.empresa_asociada` se anunciaba como la autorización para que una\nempresa le derivara a otra, y **no era un acuerdo**: la fila la escribía el que iba\na derivar, sobre sí mismo, y la otra parte ni la veía ni la podía quitar. Además\nunía EMPRESA con EMPRESA, cuando lo que trabaja junto son las **sedes**.\n\nLa reemplazó el **enlace**. `H-76`, `H-78`.\n\n### Enlace (entre dos empresas)\nUna **ruta entre dos sedes** de dos empresas distintas. `plataforma.enlace`\n(propuesta). Guarda las dos empresas y las dos sucursales, y **la crea el\noperador**, no las empresas.\n\n*No confundir con el **enlace de activación**,* el que se le manda por correo a un\nempleado para que estrene su cuenta (`core.activacion_usuario`, `H-17`). Son la\nmisma palabra y dos cosas sin relación; **falta decidir cuál se queda con ella**\nantes de que la pieza exista. *(H-80)*\n\n**Es sede a sede, no empresa a empresa.** Unir empresas es demasiado grueso: si A\ntiene las sedes A1 y A2 y lo que trabaja junto es A1 con B2, un vínculo «A trabaja\ncon B» hace que lo de A2 también le caiga a B, y B2 queda inalcanzable. Cada\npareja de sedes es otro enlace.\n\n**La crea el operador** porque para declararla una empresa tendría que teclear el\nRTN y el código de sede del otro, y eso es información confidencial que no es\nsuya. Así ninguna empresa escribe nunca el identificador de otra.\n\n`lis_app` **no lee la tabla**: pregunta por función, y la función contesta solo su\nlado —«podés mandarle al Laboratorio Ochoa desde tu sede A1»—. La sucursal del\notro no la ve nunca.\n\nEl enlace **no dice cuál sede está físicamente adentro de cuál**, a propósito: no\nsostiene ninguna regla, y decirlo sería apuntar al edificio ajeno. La vecindad\nvive en `core.sucursal.direccion`, como texto. Ver `01-la-empresa.md` 2.7.\n\n*«¿Estas dos empresas trabajan juntas?»* no se guarda: **se deduce** de que haya al\nmenos una ruta vigente entre ellas.\n\n**Ya existe** en `plataforma.enlace`. Reemplazó a `empresa asociada`, que se retiró\n**sin sustituto a nivel de empresa**.\n\n---\n\n## El recorrido de un paciente\n\nEn el orden en que ocurre.\n\n| Paso | Palabra | En la base | Qué contesta |\n|---|---|---|---|\n| 1 | **Expediente** | `core.paciente.expediente` | ¿Quién es esta persona? Uno para toda su vida |\n| 2 | **Episodio** · visita | `core.episodio` | ¿Qué pasó ese día? |\n| 3 | **Boleta** · orden | `lab.orden` | ¿Qué se le va a hacer? |\n| 4 | **Muestra** | `lab.muestra` | ¿Qué hay en este tubo? |\n| 5 | **Resultado** | `lab.resultado` | ¿Qué salió? |\n| 6 | **Informe** | `core.informe` | ¿Qué se entrega? |\n| 7 | **Entrega** | `core.entrega` | ¿A quién y cuándo se le dio? |\n\n### Boleta\nEl papel con los exámenes que se le van a hacer al paciente. **Es la palabra del\nlaboratorio**, y la que va en pantallas y documentos. En la base se llama\n`lab.orden`.\n\n### Episodio\nUna visita. Todo lo que pasó un día concreto, en una sucursal concreta. Es el\ntronco del que cuelgan las ramas: hoy laboratorio, mañana imagenología.\nEstados: `abierto`, `cerrado`, `anulado`.\n\n### Muestra\nEl tubo. Se identifica por **código de barras**, no por correlativo, porque quien\nlo lee es el analizador. Estados: `pendiente`, `tomada`, `recibida`, `rechazada`,\n`en_proceso`, `procesada`.\n\n### Resultado\nEl valor de un analito. Estados: `pendiente`, `preliminar`, `validado`,\n`corregido`, `repetir`. **Nunca se edita**: corregir crea una fila nueva y retira\nla vigencia de la anterior.\n\n### Informe\nEl documento que recibe el paciente, firmado y sellado. `core.informe`, con sus\nversiones en `core.informe_version`. Estados: `borrador`, `emitido`, `corregido`,\n`anulado`.\n\n### Derivación\nMandar un paciente, o lo suyo, de una empresa a otra. **La palabra se queda; la\ntabla no.** `audit.derivacion` es hoy una sola fila que ven las dos empresas, con\nestados de negociación —`solicitada`, `aceptada`, `rechazada`, `completada`— y la\nreemplaza el **mensaje**. `H-73`.\n\n### Mensaje\nLo que cruza entre dos empresas. `core.mensaje`. **Una fila de cada\nlado**, cada una con su `empresa_id` y su RLS de siempre: ninguna fila compartida\ny ninguna llave hacia el otro inquilino. Las escribe una función, que pasa a ser\nel único punto del sistema donde un dato cruza de empresa.\n\nTipos: `solicitud`, `consulta_historial`, `respuesta_historial`, `resultado`,\n`correccion`, `aviso`.\n\n**Un mensaje no se acepta, se recibe.** La aceptación se mudó una sola vez a la\nrelación (ver **Enlace**), así que los estados son de entrega: lo enviado va de\n`pendiente` a `entregado`, y lo recibido de `recibido` a `trabajado`.\n\n### Folio\nEl identificador de un mensaje, el mismo de los dos lados. `uuid`, no el\n`mensaje_id`: si viajara el número de secuencia le contaría a la otra empresa\ncuántos mensajes mandás. *No confundir con el **número** de la boleta*, que es el\nque el paciente tiene en la mano.\n\n### Sin enlace\nLo que pasa cuando alguien intenta mandar por una ruta que no existe: **el mensaje\nno sale**. La función lo rechaza en el origen, en vez de salir y caer en una\nbandeja del otro lado. Falla más temprano y más cerca de quien se equivocó.\n\n*Hubo un diseño anterior con una bandeja de «remitente nuevo» donde caía lo que\nllegaba sin ruta. Se murió cuando el enlace pasó a crearlo el operador: sin enlace\nya no hay salida, así que no hay nada que recibir.*\n\n---\n\n## Los números\n\n### `id`\nEl número interno de una fila: `episodio_id`, `paciente_id`. Lo genera la base,\nsirve para las llaves foráneas, y **nadie lo ve nunca**. Si se ve, es un error de\ndiseño.\n\n### Correlativo · contador\nLa tabla que reparte los números visibles. `core.correlativo`. **Contador es\nsinónimo**; el nombre del código es `correlativo`. Guarda el prefijo, el ancho y\nel último valor emitido. Cinco tipos: `expediente`, `episodio`, `informe`,\n`orden`, `muestra`.\n\n### Número\nLo que el paciente tiene en la mano: `LFO-000123`. Sale del correlativo, se\ncongela en la fila que nombra, y **no se repite jamás**. Por eso los correlativos\nno se reinician (`S-11`).\n\n### Código de barras\nEl identificador del tubo. `lab.muestra.codigo_barra`. Único por empresa. No es\nun correlativo: lo lee una máquina, no un humano.\n\n---\n\n## El aislamiento entre empresas\n\n### Multiempresa\nUn solo despliegue atiende a varios laboratorios y ninguno ve nada del otro. La\npalabra en inglés es *multi-tenant*; en los documentos se dice multiempresa.\n\n### RLS · seguridad a nivel de fila\nEl mecanismo de PostgreSQL que filtra las filas antes de que la consulta las vea.\nEstá **forzado**, así que ni el dueño de la tabla se lo salta. Es lo que hace que\n«los datos de esta empresa» no dependa de que el código se acuerde de filtrar.\n\n### `lis_app`\nEl rol de base con el que se conecta la aplicación. No es superusuario, no puede\nsaltarse RLS y no tiene `DELETE` en ninguna tabla.\n\n### Contexto de sesión\nLas dos variables que la API fija al abrir cada transacción: `lis.empresa_id` y\n`lis.usuario_id`. Vienen del token, **nunca de lo que mande el navegador**. Sin\nempresa en la sesión, las consultas devuelven cero filas.\n\n### Token · JWT\nLa credencial que el API le entrega al navegador cuando alguien entra, y que el\nnavegador devuelve en cada petición siguiente. *JSON Web Token*: tres partes\nseparadas por puntos —cabecera, contenido y firma— donde **las dos primeras se leen\nsin ninguna clave**. Cualquiera puede ver qué dice; nadie puede cambiarlo, porque la\nfirma se calcula con un secreto que solo tiene el servidor.\n\n**Con qué no confundirlo**: no es la contraseña, ni la contiene. Dice *quién sos*,\nno *cómo lo demostraste*. Y el back **no lo guarda en ninguna parte**: lo firma y lo\nolvida; cuando vuelve, recalcula la firma y compara.\n\nEn el código: se firma en `auth.service.ts` y se verifica en `auth/jwt.guard.ts`.\n\n### Las tres paredes\nLos tres controles que atraviesa una petición, cada uno contestando una pregunta que\nlos otros no saben contestar: **RLS** dice *de qué empresa son estas filas*,\n`core.usuario_puede()` dice *si este rol puede hacer esta acción*, y\n`core.sesion_vigente()` dice *si esta sesión todavía vale*. Las tres viven en la\nbase, no en la aplicación. Están en `flujos/07-como-se-entra.md`.\n\n### `SECURITY DEFINER`\nUna función que corre con los privilegios de **su dueño** en vez de los de quien la\nllama. Como el dueño es `postgres`, que es superusuario, esas funciones **se saltan\nRLS**. Es una grieta deliberada y por eso cada una está acotada: sin parámetros\nlibres, con el `search_path` fijo y con `REVOKE` de `PUBLIC`.\n\nHoy hay seis. Las dos del flujo de entrada tienen razones distintas:\n`core.buscar_credencial()` porque al entrar todavía no hay contexto que poner, y\n`core.sesion_vigente()` porque sin ella la política de `core.usuario` se llamaría a\nsí misma hasta reventar la pila.\n\n### InitPlan\nCómo PostgreSQL evalúa una función envuelta en `(SELECT ...)` dentro de una\npolítica: **una vez por consulta** en vez de una vez por fila. No es un detalle de\nestilo — medido sobre 300.000 filas, la diferencia es 21 ms contra 894.\n\n### Interceptor\nDel lado de Angular, una pieza que se mete entre `HttpClient` y la red y ve todas\nlas peticiones que salen y todas las respuestas que vuelven. Hay dos:\n`token.interceptor.ts` le pega la cabecera `Authorization`, y `error.interceptor.ts`\ntraduce un 401 en «cerrar sesión e ir al login».\n\n**Por qué ahí y no en un servicio**: porque el cliente generado desde el OpenAPI no\nva a pasar por nuestro `ApiService`, pero sí por `HttpClient`. Lo que debe aplicarse\na *todas* las peticiones no puede vivir en un envoltorio que alguien puede esquivar.\n\n### Guard\nDel lado de NestJS, la pieza que corre **antes** de cualquier controlador y decide\nsi la petición sigue. El nuestro —`auth/jwt.guard.ts`— verifica la firma del token y\ndeja la sesión en la petición. Está puesto de forma **global**: todo pide token\nsalvo lo marcado con `@Publico()`, para que olvidarse signifique quedar cerrado de\nmás y no abierto de más.\n\n### Llave foránea compuesta\n`(tabla_id, empresa_id)` en vez de solo `(tabla_id)`. Hace **imposible** colgar\nuna fila de un padre de otra empresa, aunque el código se equivoque.\n\n### Esquema\nLa división del sistema por módulos. Seis, y los seis existen:\n\n| Esquema | Qué contiene |\n|---|---|\n| `plataforma` | Por encima de las empresas: catálogo del producto e identidad compartida |\n| `core` | El núcleo: quién, dónde y cuándo |\n| `lab` | La rama de laboratorio clínico |\n| `integra` | Los analizadores y lo que mandan |\n| `audit` | El rastro y el puente entre empresas |\n| `comercial` | Tu negocio: clientes, contactos, contratos, altas y bajas. `lis_app` no tiene un solo privilegio aquí. `E-17`, `E-18`, `E-21` |\n\n---\n\n## El producto\n\n### Módulo\nUna parte del producto que se enciende por sucursal. Hoy dos: `core` y\n`lab_clinico`.\n\n### Permiso\nUna acción del dominio que un usuario puede o no hacer: `resultado.validar`,\n`orden.crear`. `plataforma.permiso`. **Solo describe acciones del usuario del\nproducto** — nunca del operador.\n\n### Rol\nUn conjunto de permisos, **por empresa**. `core.rol`. Cada empresa nace con\ncuatro y desde ahí son suyos: cambiarlos no afecta a nadie más.\n\n### Datos maestros del alta\nCon qué nace una empresa: los cuatro roles y sus permisos, el convenio\n`Particular`, los cinco correlativos, el módulo de laboratorio. Viven **dentro de\n`core.crear_empresa()`** y no en tablas de plantilla.\n\n*Hubo dos tablas —`plataforma.rol_plantilla` y `rol_plantilla_permiso`— y se\nquitaron: no son parte de RBAC —el modelo es usuario → rol → permisos— sino\nsemilla, y una semilla que se usa cada varios meses no necesita dos tablas que\npuedan desincronizarse de la realidad.*\n\n**Todavía no están decididos**, solo escritos para poder arrancar. Se declaran\ncuando `core` esté verificado entero. *(H-91)*\n\n### Nivel de acceso\nQué puede hacer una empresa **ahora mismo**: `completo`, `solo_cierre`,\n`solo_lectura`, `bloqueado`. Lo decide el lado comercial y lo escribe en\n`core.empresa`. Se comprueba **antes** que el permiso del usuario (`E-20`).\n\n### Estado\nEn qué punto de la relación comercial está la empresa. No decide qué se puede\nhacer: eso lo decide el nivel de acceso.\n\n---\n\n## Cómo se escriben estos documentos\n\n### Territorio\nUna pieza del núcleo con su documento propio: la empresa, la sucursal, la gente.\nNueve en total. Cada uno tiene las mismas once secciones.\n\n### Flujo individual\nEmpieza y termina dentro de un territorio. Se escribe en «Flujos propios» de ese\ndocumento. Se numera `F-\u003cinicial>-\u003cn>`: `F-E-3` es el tercero de la empresa.\n\n### Flujo compartido\nAtraviesa varios territorios. Se escribe en `flujos/`, y cada territorio implicado\nlo menciona con un enlace. Sus reglas se numeran `F1-1`, `F2-1`…\n\n### Regla\nAlgo que siempre es verdad, numerado con la inicial del territorio: `E-` empresa,\n`S-` sucursal, `G-` gente, `P-` paciente, `I-` identidad, `C-` por dónde entra,\n`V-` visita, `D-` documento, `A-` rastro.\n\n**Un número nunca se reutiliza ni cambia de significado.** Si una regla deja de\nvaler, se marca como retirada y se escribe la que la reemplaza con un número\nnuevo.\n\n### Hallazgo\nAlgo roto o sin decidir. Se numera `H-n` y vive en `hallazgos.md`.\n\n### Las cuatro marcas\n\n| Marca | Qué significa |\n|---|---|\n| `PENDIENTE` | La sección no está escrita. Cuenta como hueco solo si es lo primero bajo el encabezado |\n| `ABIERTO` | Falta una decisión dentro de una sección ya escrita. Se copia a `hallazgos.md` |\n| `REGLA` | Algo que siempre es verdad. Va numerado |\n| `RIESGO` | Algo que puede salir mal, o una decisión que envejece mal. Se copia a `hallazgos.md` |\n", "hallazgos.md": "# Hallazgos y errores\n\nLa lista viva de lo que vamos encontrando al documentar. Se alimenta de las\nsecciones **«Qué puede salir mal»** y **«Preguntas abiertas»** de cada territorio,\ny de **«Qué puede fallar»** de cada flujo. Se cita por número desde los documentos.\n\nEstados: **abierto** · **decidido** · **arreglado** · **descartado**\n\n## Pendientes\n\nTodo lo que no está cerrado: abierto o ya decidido pero sin implementar.\n\n| # | Dónde | Qué | Estado |\n|---|---|---|---|\n| H-1 | empresa | `core.crear_empresa()` no exige ningún permiso y es `SECURITY DEFINER`. Cualquiera que pueda ejecutarla crea empresas. | abierto |\n| H-2 | empresa | Ningún flujo crea el primer usuario. `crear_empresa` deja roles con permisos pero cero empleados y cero usuarios: la empresa nace sin nadie que pueda entrar. | abierto |\n| H-3 | empresa | No hay flujo definido para suspender ni cancelar. ¿Qué pasa con las sesiones abiertas? ¿Se puede leer y no escribir, o se cierra todo? | abierto |\n| H-4 | empresa | No existe tabla de configuración: logo, encabezado y pie del informe, b las bases que soporta— y nunca se va a ejecutar aquí: las dos advertencias son sobre la autenticación y la compresión del protocolo MySQL, y no hay conexión MySQL que atacar. **`deepmerge-ts`** llega por `@prisma/config`, que lee nuestro propio `prisma.config.ts` en la máquina del desarrollador; para explotar el agotamiento de pila alguien tendría que pasarnos un archivo de configuración malicioso, y quien pueda hacer eso ya nos está ejecutando código. Los dos cuelgan de `prisma`, y aquí está lo que se creyó primero y resultó falso: **no basta con que el CLI esté instalado con `-D`**. `@prisma/client` —que sí es de producción— declara `\"peerDependencies\": { \"prisma\": \"*\" }`, así que npm mete el CLI en el árbol de producción y `npm audit --omit=dev` **no lo saca**. Comprobado: con `@prisma/client` en `dependencies` y `prisma` en `devDependencies`, `npm ls prisma` muestra las dos ramas y el audit filtrado sigue reportando los cuatro. Y no hay forma de resolverlo con npm: `prisma@7.10.0` pide `mysql2` clavado en **`3.15.3`** y `@prisma/config` en `7.10.0`, **versiones exactas sin rango** —el `mysql2` parcheado es el `3.24.4`—, así que ni `npm audit fix` ni `--force` pueden moverlo; solo lo arregla una versión nueva de Prisma que suba sus propios pines. Se evaluó un override como el de multer y **se descartó**: allá era un rango de Nest, aquí es un pin exacto —que suele significar una elección deliberada de compatibilidad— y sería cambiarle a mano la versión a un driver que este sistema no va a cargar jamás, riesgo sin beneficio para que un contador diga cero. **`multer` sí era real**: cuatro advertencias de denegación de servicio, y llega por `@nestjs/platform-express`, que **sí viaja a producción**. Procesa `multipart/form-data`; hoy no es alcanzable porque ningún endpoint usa `FileInterceptor`, y se enciende el día de la primera subida — y `uploads/` está en el plan. **El arreglo oficial se rechazó**: `npm audit fix --force` instala `@nestjs/platform-express@12.0.3` —o sea Nest 12, descartado por tener veinte días y una migración completa a ESM— y además baja `prisma` a `6.19.3`. **Aplicado en su lugar**: `\"overrides\": { \"multer\": \"^2.3.0\" }` en `packages/api/package.json`, que resuelve a 2.4.0. Probado contra `@nestjs/platform-express@11.2.5`: `found 0 vulnerabilities`. La cuenta bajó de ocho a cuatro y las cuatro que quedan son las de `prisma`. **La regla que queda**, ya corregida por lo de arriba: `npm audit --omit=dev` es el **primer** filtro y sirve —fue el que separó a multer del ruido— pero **no contesta la pregunta que importa**, porque una peer dependency de una dependencia de producción cuenta como producción aunque nadie la ejecute nunca. La pregunta real es si el código vulnerable **llega a correr**: con multer era «hoy no, el día de la primera subida sí»; con `mysql2` y `deepmerge-ts` es «nunca» —el primero necesita una conexión MySQL que no existe, y el segundo solo se carga cuando el CLI lee `prisma.config.ts`, cosa que el API no hace al atender peticiones. Estar instalado no es estar ejecutándose, y contar vulnerabilidades sin responder eso no dice nada. **La deuda**: el override es un parche sobre una combinación que Nest no probó; cuando se suba a Nest 12 hay que revisar si todavía hace falta y quitarlo. Y queda una espera: vigilar una `prisma@7.11+` que suba sus pines de `mysql2` y `@prisma/config`, que es lo único que cierra los cuatro restantes de raíz. | decidido |\n| H-103 | seguridad | **El token no se puede revocar, y eso ya tiene arreglo.** Un JWT no se guarda en ninguna parte: el back lo firma y lo olvida, y en cada peticion vuelve a calcular la firma para comprobarla. Comprobado con dos procesos distintos que no comparten mas que el secreto. La consecuencia es que **desactivar a alguien en `core.usuario` no lo saca del sistema**: `jwt.guard.ts` solo verifica la firma, nunca toca la base, asi que el token sigue valiendo hasta vencer -- ocho horas. Se evaluaron tres salidas: que el guard consulte la base en cada peticion, token corto mas refresco, y lista negra. **Se eligio una cuarta, propuesta por said y mejor que las tres**: meter la comprobacion en las propias politicas RLS, con `core.sesion_vigente()`. Gana en lo que importa -- las otras dependen de que el guard corra, esta protege hasta las consultas que nadie escribio todavia -- y **cuesta cero** medido. Ademas la funcion **lanza** en vez de devolver `false`: una condicion de FILA debe callar (un error delataria que la fila existe), pero esta es de SESION y no hay nada que filtrar, asi que sale un `28000` con mensaje. **Aplicado** en `04_funciones.sql`, las 35 politicas de `05_privilegios.sql` y `api/src/comun/errores.filtro.ts`. Queda el freno de emergencia: cambiar `JWT_SECRETO` invalida todos los tokens del mundo de golpe. | arreglado |\n| H-104 | esquema | **Las 35 politicas llamaban a `core.empresa_actual()` sin envolver, y eso costaba 2.4x en cada consulta del sistema.** Escrita suelta, Postgres trata la funcion como filtro **por fila** y la llama una vez por cada una; envuelta en `(SELECT ...)` la evalua como **InitPlan**, una sola vez por consulta. Medido sobre 300.000 filas con 100.000 propias: **51.4 ms sueltas contra 21.6 envueltas**. Y el detalle que lo vuelve urgente: al agregar `core.sesion_vigente()` **sin** envolver, el tiempo se fue a **894.7 ms** -- diecisiete veces -- mientras que envuelta se quedo en 21.6, o sea gratis. El parentesis no es estilo: es la diferencia entre que la comprobacion de sesion sea viable o imposible. **Aplicado**: las 35 politicas quedaron envueltas. **Efecto secundario que hay que conocer**: la politica solo se evalua si la tabla tiene al menos una fila que filtrar, asi que sobre una tabla vacia el usuario desactivado recibe cero filas en silencio en vez del mensaje. La garantia no cambia -- nunca ve datos --; lo que no esta garantizado es que siempre se entere por que. | arreglado |\n\n## Cerrados\n\n| # | Dónde | Qué | Cómo se resolvió |\n|---|---|---|---|\n| H-29 | sucursal | `core.modulo_sucursal.activo` no lo lee nadie. Hoy se puede crear una orden de laboratorio en una sede donde el módulo está apagado. Es `S-9` sin mecanismo. | **Hecho.** `usuario_puede()` y `usuario_puede_en()` intersectan contra `modulo_sucursal.activo`. Apagar un módulo quita el acceso sin borrar `rol_permiso`, así que al volver a pagar el acceso vuelve solo. Ver H-99. |\n| H-27 | sucursal | `plataforma.modulo` tiene `core` y `lab_clinico`, y `crear_empresa()` solo activa `lab_clinico`. El módulo `core` no está activo en ninguna sucursal aunque diecisiete permisos cuelgan de él. Hay que decidir si se activa como cualquier otro o si es implícito y no debería estar en el catálogo. | **Hecho.** `crear_empresa()` enciende `core` y `lab_clinico`. Era urgente: al intersectar `usuario_puede()` contra la licencia, los dieciséis permisos de `core` se caían y la empresa nacía sin poder hacer nada. Ver H-99. |\n| H-26 | sucursal | `core.modulo_sucursal` tiene `activado_en` y no `desactivado_en`. Apagar un módulo pierde cuándo se apagó, que es un dato de facturación. | **Hecho.** `desactivado_en` está en `plataforma.modulo_sucursal`, con `CHECK (activo OR desactivado_en IS NOT NULL)`: apagar un módulo sin decir cuándo ya no se puede. Ver H-99. |\n| H-99 | gente | **Probado.** Dos agujeros en el mismo sitio. **Uno**: `lis_app` tenía `INSERT` y `UPDATE` sobre `core.modulo_sucursal`, así que el laboratorio podía encenderse un módulo que nadie le vendió y apagar el que sí pagaba — se demostró entrando como la aplicación. **Dos**: `lis_app` tenía `INSERT` y `UPDATE` sobre `core.rol_permiso` sin función de por medio, así que una recepcionista se dio `usuario.administrar` a sí misma y un permiso de un módulo no contratado, y las dos cosas funcionaron. Filtrar la lista en la pantalla no protegía nada: la pantalla le habla a una API y la API le hablaba a la tabla. | **Las dos tablas quedaron en solo lectura.** `core.modulo_sucursal` se mudó a **`plataforma.modulo_sucursal`** siguiendo el patrón de `plataforma.enlace` —la escribe el operador, el laboratorio la lee recortada por RLS `FOR SELECT`— y ganó `desactivado_en` (cierra H-26) y `asignado_por`. `core.rol_permiso` solo se escribe por `core.asignar_permisos_a_rol()`, que comprueba que quien llama administra usuarios, que el rol es de su empresa y que cada permiso pertenece a un módulo encendido —nombrando los rechazados— y deja el cambio en `audit.evento` con antes y después. `usuario_puede()` ahora intersecta contra la licencia y nace `usuario_puede_en(permiso, sucursal)`, la estricta. `crear_empresa()` enciende `core` además de `lab_clinico` (cierra H-27). Verificado con `94_pruebas_modulos.sql`, diez escenarios; los cinco archivos viejos siguen dando 9-2-7-1-5. |\n| H-87 | empresa | **Indecisa.** `core.empresa.actualizado_en` se quedaba, pero no estaba claro qué resolvía: una marca de frescura pensada para caché y sincronización que no leía nadie, y que además se pisaba con lo comercial —`registrar_evento()` hace `UPDATE core.empresa`, así que la fecha se movía en cada evento que ya estaba en `comercial.relacion_evento` con su motivo. | **Decidido: se va.** Resuelto por H-96 junto con las otras nueve. |\n| H-96 | esquema | **Verificado contra la base.** Entre `creado_en` y `actualizado_en` había **33 columnas y 27 sin un solo lector**, más nueve triggers y una función que existían únicamente para mantenerlas. `actualizado_en` prometía «esta fila cambió a esta hora» y no podía decir qué cambió, ni quién, ni qué decía antes —las tres preguntas que uno hace justo cuando algo salió mal—. Y donde más importaba no servía de nada: cambiar lo que puede un rol es un `INSERT` o un `DELETE` en `core.rol_permiso`, no el `UPDATE` de una columna, así que no había fila que fechar. Una mentía directamente: `comercial.cliente.actualizado_en` era la única de las diez **sin trigger**, se ponía al insertar y no se movía nunca más. | **Se retiraron 16 columnas.** Las diez `actualizado_en` enteras, con sus nueve triggers y `core.tocar_actualizado_en()`; y seis `creado_en` que tenían al lado una fecha mejor: `plataforma.enlace` (`vigente_desde`), `comercial.cliente_empresa` (`desde`), `comercial.contrato` (`fecha_inicio`), `lab.muestra` (`tomada_en`/`recibida_en`), `lab.orden_prueba` (cuelga de `lab.orden`) y `core.informe` (`informe_version.emitido_en`). Quedan 17 `creado_en`: cinco cargan peso —`ix_orden_bandeja`, `ix_resultado_por_validar`, `ix_episodio_pendientes`, `ix_episodio_paciente`, `ix_mensaje_sin_entregar`, y `posibles_duplicados()` ordena por la de `core.paciente`— y doce esperan la bitácora (`H-97`). Nace la regla `E-22`. **La base queda con cero triggers propios**: nada pasa por detrás. Reconstruida desde cero y las cinco pruebas dan exactamente lo de antes (95: 9, 96: 2, 97: 7, 98: 1, 99: 5). Espejo de SQL Server regenerado: 70 lotes, 70 parsean, 46 tablas, sin llaves hacia adelante. |\n| H-94 | esquema | **Probado en SSMS, tercera vez.** El espejo volvió a fallar, y siempre por lo mismo: el generador tenía **dos `return` que se tragaban lo que no conocían**. `tipo_sql()` terminaba en `return 'nvarchar(200)'`, así que `uuid` se volvió texto en silencio y un `text[]` también; `defecto_sql()` terminaba en `return f' DEFAULT {d}'`, así que `gen_random_uuid()` se copió tal cual y SSMS contestó «is not a recognized built-in function name». Y el índice único del enlace usaba `least()`/`greatest()` como llave, que SQL Server no admite: dio «Incorrect syntax near '('» y tumbó `core.mensaje`, y detrás nueve llaves foráneas. | Los dos `return` ahora **anotan y fallan** en vez de adivinar: el espejo no se escribe si algo quedó sin traducir. Se agregaron `uuid` → `uniqueidentifier`, `gen_random_uuid()` → `NEWID()` y `ARRAY` → `nvarchar(400)` como pérdida declarada. Los índices con expresión salen como comentario. Y el guardia pasó de lista **negra** a lista **blanca** de tipos: una lista de tokens prohibidos solo atrapa lo que uno ya pensó, y tres veces seguidas se coló algo que no estaba en ella. |\n| H-95 | visor | **Probado en navegador.** El visor se congelaba al abrir `hallazgos.md` y `core/01-la-empresa.md`: la pestaña dejaba de responder y no quedaba mas que cerrarla. El parser de markdown tiene una rama final para parrafos que **no avanzaba el contador de linea** cuando la linea parecia el arranque de un bloque sin serlo. Una fila de tabla despues de un renglon en blanco cae justo ahi: el `while` giraba para siempre y bloqueaba el hilo del navegador. Dos documentos tenian esos renglones —cuatro en total— y por eso eran los dos que colgaban. | Tres capas. **Una**, la regla de que ninguna vuelta puede terminar sin mover el contador: si nadie consumio la linea se pinta tal cual y se sigue, asi que colgarse ya no es posible con ningun texto. **Dos**, la tabla ahora salta los renglones en blanco entre filas y se ve como una sola, salvo que abajo venga el encabezado de otra. **Tres**, se quitaron los cuatro renglones de los documentos. De paso: el boton de atras del navegador no volvia al documento anterior —`replaceState` no deja huella en el historial—, bajo 900 px de ancho la lista se escondia entera y no habia forma de navegar, y abierto con doble clic reintentaba leer del disco cada dos segundos tirando veinte errores por vuelta, para siempre. Verificado con Chromium: 19 de 19 pestañas, cero errores de consola, atras funciona, y la recarga en vivo sigue andando cuando se sirve por http. |\n| H-0a | identidad | Vincular dependía solo del documento: un dígito mal tecleado unía a dos personas distintas. | Regla de dos factores (documento + año) y tabla de conflictos. `07_identidad.sql` |\n| H-0b | permisos | Los roles operativos nacían sin un solo permiso y nada comprobaba nada. | Plantillas de rol y `core.exigir_permiso()`. `16_roles.sql` |\n| H-0c | laboratorio | `corregir_resultado` insertaba la fila nueva antes de retirar la vigencia de la anterior, y el índice único la rechazaba. | Se invirtió el orden. `14_lab_rls_y_funciones.sql` |\n| H-52 | esquema | El espejo `esquema_sqlserver.sql` se había desincronizado: le faltaban `plataforma.conflicto_identidad`, `rol_plantilla` y `rol_plantilla_permiso`, le faltaban dos `CHECK`, y `plataforma.persona` todavía tenía `nombres`, `apellidos` y `fecha_nacimiento` —lo contrario de lo que decidió el diseño de identidad—. | Se dejó de escribir a mano: ahora lo genera `generar_sqlserver.py` leyendo la base viva. |\n| H-20 | empresa | Falta el estado `cerrada`: hoy `cancelada` mezcla «en plazo de cierre» con «sin acceso». | Se agregó al enum en `01_esquemas_y_tipos.sql`, junto con el tipo `core.nivel_acceso`. |\n| H-22 | empresa | Falta un índice sobre `(estado, fecha_cierre)` para la tarea diaria de cierre. Irrelevante con veinte clientes, conviene anotarlo antes de que deje de serlo. | `ix_empresa_cierre` creado en `03_core.sql`, parcial sobre `fecha_cierre IS NOT NULL`. |\n| H-55 | empresa | **Probado.** `lis_app` tiene `UPDATE` sobre las siete columnas de `core.empresa` y `rls_empresa` deja pasar la propia fila: un usuario del laboratorio se levanta su propia suspensión (`estado` de `suspendida` a `activa`) y se cambia el `rtn`. Reproducido contra la base. El documento asigna las dos acciones al operador «fuera del catálogo». Falta `REVOKE UPDATE` y `GRANT` por columna. | `REVOKE UPDATE ON core.empresa FROM lis_app` más `GRANT UPDATE (nombre_comercial)`. Probado en `95_pruebas_comercial.sql`, caso 2. |\n| H-81 | documentación | `E-21` separó cliente de empresa y media documentación seguía llamando «el cliente» al inquilino: el primer renglón de `01-la-empresa.md`, el panorama, la sucursal, dos encabezados del glosario, «el administrador del cliente» dentro de la regla `S-1`, «Exportar los datos del cliente» (`F-E-8`), y hasta el sentido HTTP —«nunca de lo que mande el cliente»—, que era un tercer significado. | Barrido de 25 frases en cinco documentos, una por una: se cambiaron las que **definen** la empresa o nombran sus datos o su gente, y se dejaron las coloquiales —«el primer cliente», «tu cartera de clientes», «el cliente avisó»—, que se entienden por contexto. La regla quedó escrita en `00-como-leer.md` y en el glosario. |\n| H-9 | esquema | **Probado.** El espejo `esquema_sqlserver.sql` nunca se había ejecutado contra un SQL Server real. Al correrlo por primera vez falló: `array_length()` no existe en SQL Server, y dos `CHECK` usaban una columna `bit` como condición —legal en PostgreSQL, donde `boolean` **es** una condición, ilegal en SQL Server, donde `bit` no lo es—. Las tres tablas que fallaron eran padres, así que se cayeron seis llaves foráneas detrás. Un analizador de T-SQL había aceptado los tres sin quejarse: **parsear no es validar**. | El traductor manda a comentario los `CHECK` con funciones de arreglo, y convierte las columnas `bit` usadas como condición (`NOT resuelto` → `resuelto = 0`, `exito` → `exito = 1`). Y el generador lleva un guardia que revisa su propia salida y se niega a escribir el archivo si encuentra sintaxis de PostgreSQL, un `bit` usado como condición o `true`/`false`. |\n| H-73 | documentación | **Decidido y aplicado.** El paciente entre dos empresas se resuelve con mensajes y una referencia guardada por cada lado (`flujos/06`). Faltaba retirar todo lo que el modelo dejó atrás. | Se retiraron `plataforma.persona`, `plataforma.conflicto_identidad`, `plataforma.vincular_persona()`, `core.vincular_paciente_identidad()` y los tipos `veredicto_identidad` y `tipo_conflicto`; `audit.derivacion` la reemplazó `core.mensaje` —una fila de cada lado— y `core.paciente.persona_id` la reemplazó `core.paciente_referencia`. `core.registrar_paciente()` ya no vincula contra ningún registro global. Probado en `97_pruebas_identidad.sql`, 16 casos. |\n| H-76 | por dónde entra | **Probado.** `core.empresa_asociada` se anunciaba como «la ÚNICA autorización para que una empresa derive a otra», pero el consentimiento era unilateral: la fila la escribía el remitente sobre sí mismo, y el destinatario ni la veía —RLS le mostraba solo lo suyo— ni la podía quitar ni evitar que le llegara la derivación. `rls_derivacion` comprobaba que el remitente se hubiera dado permiso solo. | Se retiró la tabla entera. La reemplazó `plataforma.enlace`, que crea el operador. |\n| H-78 | por dónde entra | **Decidido y aplicado.** Que dos empresas trabajen juntas se declara como una ruta **entre dos sedes**, no entre dos empresas: si A tiene A1 y A2 y lo que trabaja junto es A1 con B2, un vínculo «A trabaja con B» hace que lo de A2 también le caiga a B y deja a B2 inalcanzable. La crea el operador, porque para declararla un cliente tendría que teclear el RTN y el código de sede del otro. | `plataforma.enlace` en `03_core.sql` y `plataforma.crear_enlace()`, `core.mis_enlaces()` y `core.entregar()` en `08_enlace_y_mensaje.sql`. `lis_app` no lee la tabla: pregunta por función y solo ve su lado. El permiso `derivacion.responder` se retiró, porque ya no se acepta nada. |\n| H-21 | plataforma | `plataforma.persona` y `plataforma.conflicto_identidad` tenían llave foránea hacia `core.empresa`, lo que invertía la idea de que `plataforma` está por encima de las empresas. | Se cerró solo: las dos tablas se retiraron con `H-73`. Hoy ninguna tabla de `plataforma` apunta a `core.empresa`. |\n| H-84 | esquema | `core.crear_empresa()` estaba definida dos veces con la misma firma: `06_semillas.sql` y `16_roles.sql`. La segunda pisaba a la primera en silencio, así que quien leyera `06` para entender el alta leía una versión que nunca se ejecutaba —creaba los roles operativos vacíos—. | Se borró la de `06_semillas.sql`, que quedó con una nota diciendo dónde vive la viva, y se corrigió `LEEME.md`. Comprobado: `crear_empresa` se define **una** vez. |\n| H-86 | esquema | **Probado.** El espejo de SQL Server no corría: `ck_resultado_validado` salía con `estado \u003c> ALL (ARRAY['validado','corregido'])`, que es sintaxis de PostgreSQL —SQL Server no tiene constructor de arreglos— y habría reventado en SSMS. El traductor de `generar_sqlserver.py` cubría `ANY (ARRAY[...])` pero no `ALL`. También decía «los cinco esquemas» cuando ya son seis, y se comía las restricciones `EXCLUDE` sin avisar. | Reglas nuevas en `traducir_def()`: `\u003c> ALL (ARRAY[…])` → `NOT IN (…)` y `= ANY (ARRAY[…])` → `IN (…)`. El conteo de esquemas se calcula. Las `EXCLUDE` salen como comentario en vez de desaparecer. Comprobado parseando los 67 lotes con `sqlglot` en dialecto `tsql`: 66 correctos y el restante es un hueco del parser con `SELECT @sql += …`, que es T-SQL válido. |\n| H-56 | esquema | **Probado.** Ni `core.crear_empresa()` ni `plataforma.vincular_persona()` llevan `REVOKE ALL ... FROM PUBLIC`, así que `EXECUTE` es de `PUBLIC` por el valor por defecto de PostgreSQL: `has_function_privilege('public', ...)` devuelve `t` en las dos. El `GRANT` explícito a `lis_app` de `vincular_persona` no quita el de `PUBLIC`. Es el complemento operable de H-1 y se cierra con dos líneas. | `REVOKE ALL ... FROM PUBLIC` en `crear_empresa` (`16_roles.sql`) y en `vincular_persona` (`07_identidad.sql`). Probado en el caso 9. |\n", "core/00-panorama.md": "# Panorama de core\n\nLos nueve territorios del núcleo, en el orden en que se recorren cuando un paciente\nentra por la puerta.\n\n## Los territorios y qué contiene cada uno\n\n| Territorio | Tablas | Pregunta que contesta |\n|---|---|---|\n| La empresa | `empresa` | ¿De quién es esto y hasta dónde llega su mundo? |\n| La sucursal | `sucursal`, `modulo_sucursal`, `correlativo` | ¿Dónde se atiende y con qué módulos encendidos? |\n| La gente que trabaja | `empleado`, `usuario`, `rol`, `rol_permiso`, `acceso_sucursal` | ¿Quién puede entrar y qué puede hacer? |\n| El paciente | `paciente` | ¿A quién se atiende? |\n| La identidad compartida | `plataforma.persona`, `plataforma.conflicto_identidad` | ¿Es el mismo señor que atiende la clínica de al lado? |\n| Por dónde entra | `convenio`, `medico`, `empresa_asociada`, `audit.derivacion` | ¿Quién lo mandó y con qué acuerdo? |\n| La visita | `episodio` | ¿Qué pasó ese día? |\n| El documento | `informe`, `informe_version`, `entrega` | ¿Qué se entregó, a quién y cuándo? |\n| El rastro | `audit.evento` | ¿Quién hizo qué? |\n\n## Cómo se encadenan\n\n```\nempresa ──> sucursal ──> correlativo\n   │            └──> modulo_sucursal\n   ├──> empleado ──> usuario ──> rol ──> rol_permiso\n   │                    └──> acceso_sucursal\n   ├──> paciente ─ ─ ─> persona          (vínculo de identidad, no de datos)\n   ├──> medico\n   ├──> convenio ─ ─ ─> empresa (otra)   (el puente hacia el futuro)\n   └──> empresa_asociada ──> derivacion\n                                │\n        paciente + sucursal + convenio + medico + derivacion\n                                │\n                                v\n                            EPISODIO\n                                │\n                                ├──> informe ──> informe_version ──> entrega\n                                └──> (rama de laboratorio)\n```\n\n## La regla que ordena todo\n\n> **REGLA** — El núcleo no conoce a las ramas. Ninguna tabla de `core` tiene una\n> llave foránea hacia `lab` o `integra`. Es la rama la que apunta al núcleo. Si\n> algo de aquí tuviera que cambiar cuando llegue imagenología, no es del núcleo.\n\n## Orden de lectura sugerido\n\nLos territorios se pueden leer sueltos, pero el orden de arriba es el que hace que\ncada uno se apoye en el anterior. Los flujos conjuntos se leen después, cuando ya\nexiste el vocabulario.\n\n## Qué falta en este panorama\n\n> **ABIERTO** — Un diagrama de los estados que cambian a lo largo de una visita,\n> cruzando episodio, orden, muestra y resultado en una sola línea de tiempo.\n", "core/01-la-empresa.md": "# La empresa\n\nEl inquilino del sistema. Es la unidad de aislamiento: todo lo que existe\npertenece a una empresa y solo a una.\n\n*No es el cliente.* El cliente es quien firmó el contrato y a quien se le factura,\ny vive en `comercial.cliente` (`E-21`). Casi siempre hay uno de cada uno, y por eso\nse confunden.\n\n> Este documento está completo y sirve de modelo para los demás. Once secciones,\n> según la plantilla. Aun así, las referencias entre documentos van por **nombre**\n> de sección y no por número.\n\n## 1. Qué es y por qué existe\n\nUna empresa es una razón social que contrata el sistema. En el primer cliente hay\ndos empresas distintas en el mismo edificio —la clínica y el laboratorio— y esa es\nexactamente la razón por la que la empresa existe como pieza y no como una simple\ncolumna de configuración.\n\n**Qué resuelve:** que dos clientes del mismo SaaS no puedan verse. Cada fila de cada\ntabla de dominio lleva `empresa_id`, y la base filtra por ella con Row Level\nSecurity, sin depender de que el código se acuerde.\n\n**Qué pasaría sin ella:** habría que instalar una copia del sistema por cliente. Eso\nconvierte cada actualización en una visita, y deja de ser un SaaS.\n\n**Qué NO es:** no es la sucursal. La empresa no atiende a nadie; atienden sus\nsucursales. Todo lo operativo —precios, correlativos, equipos, accesos— cuelga de la\nsucursal.\n\n## 2. Las tablas y sus campos\n\nEn el LIS este territorio tiene **una sola tabla**: `core.empresa`. Del lado\ncomercial hay tres más —`cliente`, `contacto` y `cliente_empresa`, en 2.6— y lo\núnico que sigue sin existir es `core.empresa_configuracion`, marcada como\npropuesta en 2.4.\n\nTodo lo de esta sección está comprobado contra la base en septiembre de 2026, no\nescrito de memoria.\n\n### 2.1 · `core.empresa` — lo que existe\n\nNueve columnas. **Ninguna llave foránea saliente**: la empresa es la raíz del\nsistema y no depende de nada.\n\n| Columna | Tipo | Nulo | Por defecto | Para qué sirve y qué resuelve |\n|---|---|---|---|---|\n| `empresa_id` | `bigint` identidad | no | generado | La llave. Es el valor que viaja en `lis.empresa_id` y contra el que compara cada política RLS del sistema. Resuelve el aislamiento: sin este número, «los datos de esta empresa» no es una idea expresable. |\n| `nombre` | `text` | no | — | Razón social. Va impresa en el encabezado de cada informe y en cualquier documento legal. **No es único a propósito**: dos razones sociales distintas pueden llamarse parecido, y lo único que identifica de verdad es el RTN. |\n| `nombre_comercial` | `text` | sí | — | Con el que lo conoce la gente. «Laboratorio Familiar Ochoa» puede no ser la razón social registrada. Resuelve que el informe se vea como el cliente quiere sin falsear el dato legal. |\n| `rtn` | `text` | sí | — | Registro Tributario Nacional **con el que esta empresa le factura a sus pacientes**, y con el que otra empresa la nombra para trabajar con ella. Único solo cuando existe, por índice parcial: eso evita dar de alta dos veces al mismo laboratorio. **No es la identidad fiscal del cliente** —esa es `comercial.cliente.rtn`— y por eso no sirve para detectar que un cliente se dio de alta dos veces: un cliente puede tener varias empresas, cada una con su RTN (`E-21`). Es opcional porque en periodo de prueba todavía no hay papeles. |\n| `estado` | `core.estado_empresa` | no | `prueba` | El ciclo de vida de la suscripción. Resuelve que suspender por mora y cancelar sean cosas distintas, con salidas distintas. No decide qué se puede hacer: eso lo decide el nivel de acceso. |\n| `nivel_acceso` | `core.nivel_acceso` | no | `completo` | Qué puede hacer la empresa ahora mismo. Lo decide el lado comercial y lo escribe aquí: la API lo consulta en cada petición y no puede cruzar la frontera cada vez. Es una de las dos formas en que una decisión comercial entra al LIS (`E-16`) |\n| `fecha_cierre` | `date` | sí | — | Cuándo vence el plazo. La usa la tarea diaria de cierre. Vive de este lado a propósito: así el sistema se cierra solo el día que toca aunque la administración esté apagada |\n| `creado_en` | `timestamptz` | no | `now()` | Cuándo se dio de alta la empresa. No la lee nadie todavía. Se queda porque se escribe una vez y no puede mentir, y porque hoy es lo único que contesta «¿desde cuándo existe esto?». El día que exista la bitácora, el `INSERT` registrado da esa misma fecha **y además el quién**, y entonces sobra (`H-97`). |\n\n> **REGLA** — `E-22`: **ninguna tabla lleva `actualizado_en`, y la base no tiene\n> triggers.** Esa columna prometía «esta fila cambió a esta hora» y no podía decir qué\n> cambió, ni quién, ni qué decía antes —las tres preguntas que uno hace justo cuando algo\n> salió mal—. Para eso está `audit.evento`, que ya tiene `usuario_id`, `accion`,\n> `datos_antes` y `datos_despues`. Donde más importaba tampoco servía: cambiar lo que puede\n> un rol es un `INSERT` o un `DELETE` en `core.rol_permiso`, no el `UPDATE` de una columna,\n> así que no había fila que fechar. Se retiraron las diez columnas, los nueve triggers y\n> `core.tocar_actualizado_en()`. Consecuencia: nada pasa por detrás, todo lo que ocurre está\n> escrito en una función que se puede leer y probar. *(H-96, cierra H-87)*\n\n#### Restricciones e índices\n\n| Objeto | Qué es | Qué resuelve |\n|---|---|---|\n| `empresa_pkey` | Llave primaria sobre `empresa_id` | La identidad de la fila |\n| `uq_empresa_rtn` | Único **parcial**: `(rtn) WHERE rtn IS NOT NULL` | Que dos empresas no compartan RTN, sin que dos empresas sin RTN choquen entre sí. Un `UNIQUE` normal no serviría: en PostgreSQL varios nulos no colisionan, pero el índice parcial deja la intención escrita |\n| `rls_empresa` | Política RLS forzada | Que una empresa solo se vea a sí misma. Es la única tabla del núcleo donde la política compara contra su propia llave y no contra una columna `empresa_id` |\n\n> **RIESGO** — La política `rls_empresa` significa que **con el rol de la\n> aplicación nadie puede listar las empresas**: cada sesión solo ve la suya. Eso es\n> correcto para el producto, pero deja al operador de la plataforma sin forma de\n> ver su cartera de clientes. Confirma que hace falta un canal aparte con su propia\n> autenticación. *(H-16)*\n\n#### Llaves foráneas salientes\n\nNinguna. Es deliberado: la empresa es la raíz y no puede depender de nada, porque\ntodo depende de ella.\n\n### 2.2 · Quién apunta a `core.empresa`\n\n**Treinta y ocho** llaves foráneas, y no todas significan lo mismo. La\ndistinción importa porque solo una de las tres clases participa en el\naislamiento.\n\nEran cuarenta y dos hasta que se retiró la identidad compartida (`H-73`), y una menos desde que se retiró `core.medico` (`H-98`). Lo que\nmás se movió es la tercera clase —las que mencionan a **dos** empresas— que\n**bajó de cinco a dos**. Es la mejor medida de que el modelo nuevo funciona.\n\n#### Pertenencia — 34 llaves\n\nLa columna se llama `empresa_id` y quiere decir *«esta fila es de esta empresa»*.\nEs la columna sobre la que actúa RLS, y la que forma la mitad de cada llave foránea\ncompuesta.\n\n`core`: `sucursal`, `modulo_sucursal`, `correlativo`, `empleado`, `usuario`, `rol`,\n`rol_permiso`, `acceso_sucursal`, `paciente`, `paciente_referencia`, `mensaje`,\n`convenio`, `episodio`, `informe`, `informe_version`, `entrega`\n\n`lab`: `area`, `tipo_muestra`, `analito`, `prueba`, `prueba_analito`,\n`precio_prueba`, `rango_referencia`, `orden`, `muestra`, `muestra_rechazo`,\n`orden_prueba`, `resultado`, `aviso_valor_critico`\n\n`integra`: `equipo`, `mapeo_codigo`, `mensaje_crudo`, `intento_proceso`\n\n`audit`: `evento`\n\n#### Desde `comercial` — 2 llaves\n\n`comercial.relacion_evento.empresa_id` y `comercial.cliente_empresa.empresa_id`.\n\nSe llaman igual que las de arriba y **no son lo mismo**. No hay RLS en `comercial`,\nasí que estas columnas no aíslan nada: dicen *«este hecho del negocio es sobre ese\ninquilino»*. Es la única dirección permitida por `E-18` —el negocio apunta al\nproducto, nunca al revés— y por eso se cuentan aparte.\n\n#### Referencia a una segunda empresa — 2 llaves\n\nAquí la empresa referenciada **no es la dueña de la fila**. Son las únicas dos\ndel sistema, y por eso son las que hay que mirar con lupa.\n\n| Tabla y columna | Qué significa | Qué resuelve |\n|---|---|---|\n| `core.convenio.empresa_destino_id` | El convenio apunta a otra empresa del sistema | Hoy la clínica es una fila de catálogo con esto en nulo; el día que entre al sistema, apunta a su empresa y la solicitud pasa de papel a electrónica sin migrar órdenes |\n| `core.paciente_referencia.contraparte_empresa_id` | Cómo llama la otra empresa a mi paciente | Menciona a otra empresa pero **no le da ningún privilegio**: RLS impide leer esa fila, así que del otro lado es un número opaco. Reemplaza a `core.paciente.persona_id`, que colgaba de una fila de identidad compartida |\n\n**Se fueron tres**, con la identidad compartida y la derivación vieja:\n`core.empresa_asociada.empresa_destino_id`, `audit.derivacion.empresa_origen_id`\ny `audit.derivacion.empresa_destino_id`, más\n`plataforma.persona.creado_por_empresa_id` cuando la tabla dejó de existir.\n\n`H-21` se cierra con esto: preguntaba si estaba bien que `plataforma` dependiera\nde `core.empresa`, y las dos tablas que lo hacían ya no existen.\n\n### 2.3 · La frontera con lo comercial — decisión\n\nDos tablas que este documento proponía —`plataforma.motivo_estado` y\n`core.empresa_estado_historial`— **se retiran del LIS**. No porque estuvieran mal\npensadas, sino porque no son de esta base.\n\n**El razonamiento.** El histórico de la relación con un cliente —cuándo entró, por\nqué, cuándo se fue, hasta cuándo le vendiste el servicio— es administración del\ndueño del sistema, no del laboratorio. La tabla propuesta lo delataba sola: su\ncolumna `ejecutado_por` tenía que ser `text` y no una llave foránea a\n`core.usuario`, «porque el operador de la plataforma no es un usuario de ninguna\nempresa». Una tabla cuyo actor no se puede expresar en el modelo de seguridad de\nsu propia base está en la base equivocada. Y con RLS no había salida buena: o el\nlaboratorio veía su propio historial de suspensiones, o era la única tabla de\n`core` sin política.\n\n**Dónde va.** A un esquema aparte —`comercial`— **en el mismo PostgreSQL**, con\n`REVOKE ALL` para `lis_app`, igual que ya se hace con `plataforma.persona`. Mismo\nmotor y no otra base: así el alta sigue siendo una sola transacción (`F1-1`), la\nllave foránea hacia `core.empresa` es real, y no aparece el problema de dos copias\nque se desincronizan. El día que haya que separarlo de verdad es un `pg_dump` de\nun esquema.\n\nEs también lo que hace la industria: de doce productos multiempresa inspeccionados\n—Plausible, Cal.com, GitLab, PostHog, Odoo, Chatwoot y otros— **ninguno pone lo\nadministrativo en una base aparte a esta escala**. Los que separan lo hacen en un\nservicio, y cuando ya no caben en una máquina.\n\n**Qué se queda en el LIS.** Solo lo que el sistema tiene que hacer cumplir en cada\npetición: `estado`, `nivel_acceso` y `fecha_cierre`, las tres en `core.empresa`.\nEl LIS **no sabe por qué** una empresa está limitada — recibe un nivel y una fecha\ny los aplica. Esa ignorancia es la frontera.\n\n`fecha_cierre` se queda de este lado a propósito: así el sistema se cierra solo el\ndía que toca, aunque la consola de administración esté apagada.\n\n> **REGLA** — `E-17` · El LIS no conoce el motivo. `core.empresa` guarda qué puede\n> hacer la empresa y hasta cuándo; por qué es así vive en `comercial` y no cruza.\n\n> **REGLA** — `E-18` · `core` y `lab` **nunca** referencian `comercial`.\n> `comercial` referencia `core.empresa`. Una sola dirección, y `lis_app` no tiene\n> ni un privilegio sobre `comercial`. Si algún día una función del LIS necesita\n> leer ese esquema, es que la frontera se movió y hay que revisar por qué.\n\n> **ABIERTO** — Nada hace cumplir `E-18` todavía. Cuando el esquema exista, el\n> revisor de esquema puede comprobarlo mecánicamente, que es como GitLab resuelve\n> el mismo problema: declarar a qué dominio pertenece cada tabla y romper la\n> comprobación si alguien cruza. *(H-53)*\n\n#### Lo que se lleva, anotado para cuando armes lo come
